<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Multi-verso Kin</title>
  <meta name="description" content="Manga, manhwa y novelas ligeras: ZonaTMO, ManhwaSS, Olympus, LeerCapitulo, Skynovels, MatchaNovels, Astral, Anslid y DevilNovels." />
  <link rel="icon" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #E2B96F;
      --on-accent: #141008;
      --accent-soft: rgba(226, 185, 111, 0.14);
      --bg: #08080C;
      --surface: #111117;
      --surface-high: #1A1A23;
      --text: #F4F1EA;
      --muted: #9E98AE;
      --border: rgba(255, 255, 255, 0.085);
      --border-strong: rgba(255, 255, 255, 0.18);
      --danger: #F87171;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --font-book: "Lora", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 42% at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 72%),
        radial-gradient(ellipse 40% 30% at 88% 18%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 70%);
      z-index: 0;
    }

    body.reader-active::before { display: none; }

    .tabular-nums {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      width: 100%;
      background: transparent;
    }

    .atelier-container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* ================= 3-ZONE TOP BAR CONTRACT ================= */
    .kino-appbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 60px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .kino-appbar::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .kino-appbar-inner {
      height: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }
    .topbar-brand-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-shrink: 0;
    }
    .wordmark-btn {
      background: none;
      border: none;
      padding: 4px 0;
      margin: 0;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.16s var(--ease-out);
    }
    .wordmark-btn:hover { color: var(--accent); }
    .topbar-route-sub {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 340px;
    }

    .kino-navbar {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .kino-nav-item {
      position: relative;
      background: transparent;
      border: none;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 8px 2px;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: color 0.16s var(--ease-out);
    }
    .kino-nav-item svg { width: 15px; height: 15px; opacity: 0.72; }
    .kino-nav-item:hover { color: var(--text); }
    .kino-nav-item.active {
      color: var(--text);
      font-weight: 600;
    }
    .kino-nav-item.active svg { color: var(--accent); opacity: 1; }
    .kino-nav-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1.5px;
      background: var(--accent);
    }

    .kino-appbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .utility-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 0.16s var(--ease-out), background 0.16s var(--ease-out);
    }
    .utility-btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-high);
    }
    .theme-swatch-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    /* Theme Atelier Popover */
    .theme-popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 65;
      background: transparent;
    }
    .theme-popover {
      position: fixed;
      top: 66px;
      right: max(16px, calc(50% - 636px));
      z-index: 66;
      width: 310px;
      max-width: calc(100vw - 32px);
      background: color-mix(in srgb, var(--surface) 94%, black);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
      animation: panelDrop 0.16s var(--ease-out);
    }
    .theme-popover-title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 10px;
      color: var(--text);
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .theme-opt-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-high);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.14s, transform 0.14s;
    }
    .theme-opt-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .theme-opt-btn.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-high)); font-weight: 600; }
    .theme-opt-swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.28);
    }
    .theme-opt-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 767px) {
      .kino-appbar { height: 52px; }
      .kino-appbar-inner { padding: 0 14px; gap: 12px; }
      .wordmark-btn { font-size: 21px; }
      .kino-navbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 54px;
        z-index: 40;
        background: color-mix(in srgb, var(--surface) 92%, black);
        backdrop-filter: blur(18px);
        border-top: 1px solid var(--border);
        justify-content: space-around;
        gap: 0;
        transition: transform 0.18s var(--ease-out), opacity 0.18s var(--ease-out);
      }
      .kino-navbar.bar-hidden {
        transform: translateY(100%);
        opacity: 0;
        pointer-events: none;
      }
      .kino-nav-item {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        font-size: 11px;
        padding: 4px;
      }
      .kino-nav-item.active::after { display: none; }
      .source-bar-shell { padding: 12px 14px 4px; }
    }

    /* ================= BODY & SCROLL ================= */
    .kino-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .kino-body > .kino-col { flex: 1; min-height: 0; }
    .kino-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 56px;
    }
    @media (max-width: 767px) {
      .kino-scroll { padding-bottom: 84px; }
    }
    .kino-scroll.horizontal { overflow-x: auto; overflow-y: hidden; padding-bottom: 0; }
    .kino-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 32px; }
    .kino-col { display: flex; flex-direction: column; min-width: 0; }
    .kino-row { display: flex; flex-direction: row; align-items: center; min-width: 0; }
    .kino-row.wrap-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: stretch; }
    .kino-stack { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .kino-positioned { position: absolute; z-index: 30; }
    .kino-panel-overlay { animation: panelDrop 0.16s var(--ease-out); }
    @keyframes panelDrop {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= SOURCE ATELIER BAR & DRAWER ================= */
    .source-bar-shell {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 16px 24px 4px;
    }
    .kino-capsule-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.16s var(--ease-out), background 0.16s var(--ease-out);
    }
    .kino-capsule-btn:hover, .kino-capsule-btn.selected {
      border-color: var(--accent);
      background: var(--surface-high);
    }
    .capsule-meta-hint {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-left: auto;
    }

    .source-atelier-panel {
      max-width: 960px;
      margin: 8px auto 0;
      background: color-mix(in srgb, var(--surface) 95%, black);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.72);
    }
    .source-atelier-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .source-atelier-head h3 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
    }
    .source-atelier-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 767px) {
      .source-bar-shell { padding: 12px 14px 4px; }
      .source-atelier-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .source-tile-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-high);
      color: var(--text);
      font-family: var(--font-sans);
      text-align: left;
      cursor: pointer;
      min-height: 48px;
      transition: border-color 0.14s, background 0.14s, transform 0.14s;
    }
    .source-tile-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .source-tile-btn.selected {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--surface-high));
    }
    .source-tile-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .source-tile-type { font-size: 11px; color: var(--muted); white-space: nowrap; }

    /* ================= HERO SPOTLIGHT (HOME) ================= */
    .atelier-hero-wrap {
      max-width: 1320px;
      width: 100%;
      margin: 14px auto 12px;
      padding: 0 24px;
    }
    .atelier-hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(200px, 260px);
      align-items: stretch;
      gap: 40px;
      padding: 36px 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
      min-height: 340px;
    }
    .atelier-hero-backdrop {
      position: absolute;
      inset: -24px;
      background-size: cover;
      background-position: center;
      filter: blur(48px) saturate(1.25);
      opacity: 0.22;
      transform: scale(1.08);
      pointer-events: none;
    }
    .atelier-hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(102deg, color-mix(in srgb, var(--bg) 92%, transparent) 0%, color-mix(in srgb, var(--surface) 78%, transparent) 55%, rgba(8, 8, 12, 0.52) 100%);
      pointer-events: none;
    }
    .atelier-hero-left {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      min-width: 0;
    }
    .editorial-kicker {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .atelier-hero-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.6vw, 3.25rem);
      font-weight: 700;
      line-height: 1.04;
      color: var(--text);
      text-wrap: balance;
      max-width: 18ch;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .atelier-hero-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .atelier-hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    .atelier-hero-right {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .hero-poster-frame {
      width: 100%;
      max-width: 230px;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65);
      background: var(--surface-high);
      cursor: pointer;
      padding: 0;
      transition: transform 0.22s var(--ease-out), border-color 0.22s var(--ease-out);
    }
    .hero-poster-frame:hover {
      transform: translateY(-4px) scale(1.015);
      border-color: var(--accent);
    }
    .hero-poster-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 767px) {
      .atelier-hero-wrap { padding: 0 14px; margin-top: 10px; }
      .atelier-hero {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 22px 20px;
        min-height: 0;
      }
      .atelier-hero-right { justify-content: flex-start; }
      .hero-poster-frame { max-width: 136px; }
    }

    /* ================= RAILS & GALLERY GRIDS ================= */
    .kino-rail-section {
      max-width: 1320px;
      width: 100%;
      margin: 8px auto 12px;
      padding: 0 24px;
    }
    .kino-rail-header-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      padding: 10px 0 14px;
    }
    .kino-rail-header {
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
    }
    .rail-hairline {
      flex: 1;
      min-width: 24px;
      height: 1px;
      background: var(--border);
    }
    .rail-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      max-width: 100%;
    }
    .rail-count {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .rail-arrows {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rail-arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.14s, background 0.14s;
    }
    .rail-arrow-btn:hover { border-color: var(--accent); background: var(--surface-high); }

    .rail-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      max-width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: border-color 0.16s var(--ease-out), background 0.16s var(--ease-out), color 0.16s var(--ease-out), transform 0.14s var(--ease-out);
    }
    .rail-more-btn:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--surface-high));
    }
    .rail-more-btn.at-end {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 26%, transparent);
    }
    .rail-more-btn svg { flex-shrink: 0; }
    .rail-more-btn span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rail-end-card {
      flex: 0 0 158px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      cursor: pointer;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-family: var(--font-sans);
    }
    .rail-end-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-sm);
      border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--border));
      background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--accent) 16%, transparent), var(--surface));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 12px;
      text-align: center;
      color: var(--text);
      transition: border-color 0.18s var(--ease-out), background 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    }
    .rail-end-card:hover .rail-end-box {
      border-style: solid;
      border-color: var(--accent);
      background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--accent) 24%, transparent), var(--surface-high));
      transform: translateY(-2px);
    }
    .rail-end-icon {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .rail-end-label {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--accent);
    }
    .rail-end-sub {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }

    .kino-rail-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 2px 2px 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-high) transparent;
    }
    .kino-grid {
      display: grid;
      gap: 20px 16px;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 24px 20px;
    }
    @media (max-width: 767px) {
      .kino-rail-section { padding: 0 14px; }
      .kino-rail-header { font-size: 21px; }
      .rail-hairline { display: none; }
      .rail-header-actions { width: 100%; justify-content: space-between; margin-left: 0; }
      .rail-arrows { display: none; }
      .rail-more-btn { font-size: 11.5px; height: 30px; padding: 0 10px; }
      .rail-end-card { flex: 0 0 122px; }
      .kino-grid { padding: 8px 14px 16px; gap: 14px 10px; }
    }

    .title-card {
      flex: 0 0 158px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      cursor: pointer;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-family: var(--font-sans);
    }
    @media (max-width: 767px) {
      .title-card { flex: 0 0 122px; gap: 7px; }
    }
    .kino-grid .title-card { flex: initial; width: 100%; }

    .title-poster-box {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: linear-gradient(145deg, var(--surface-high), var(--surface));
      border: 1px solid var(--border);
      transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
    }
    .title-poster-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8, 8, 12, 0.55) 0%, transparent 40%);
      opacity: 0.7;
      pointer-events: none;
    }
    .title-card:hover .title-poster-box {
      border-color: var(--accent);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5);
    }
    .title-poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.28s var(--ease-out);
    }
    .title-card:hover .title-poster-box img { transform: scale(1.04); }
    .title-poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      text-align: center;
      background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 16%, transparent), var(--surface-high));
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
    }
    .title-badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      background: rgba(8, 8, 12, 0.86);
      backdrop-filter: blur(8px);
      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ================= BUTTONS, INPUTS, CHIPS, TEXT ================= */
    .kino-text { margin: 0; line-height: 1.55; word-break: break-word; }
    .kino-text.h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.1; }
    .kino-text.h2 { font-family: var(--font-display); font-size: 27px; font-weight: 700; line-height: 1.15; }
    .kino-text.h3 { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.2; }
    .kino-text.h4 { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.25; }
    .kino-text.h5 { font-size: 15px; font-weight: 600; }
    .kino-text.p, .kino-text.body { font-size: 14.5px; }
    .kino-text.caption { font-size: 12px; }
    .kino-text.label { font-size: 12px; font-weight: 600; }
    .kino-text.color-primary, .kino-text.color-accent { color: var(--accent); }
    .kino-text.color-muted { color: var(--muted); }
    .kino-text.tappable {
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .kino-text.tappable:hover { background: rgba(255, 255, 255, 0.05); }

    .kino-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 18px;
      min-height: 40px;
      white-space: nowrap;
      transition: background 0.16s var(--ease-out), border-color 0.16s var(--ease-out), transform 0.12s var(--ease-out), opacity 0.16s;
      color: var(--text);
      background: transparent;
    }
    .kino-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .kino-btn:active:not(:disabled) { transform: scale(0.98); }
    .kino-btn.fill { width: 100%; }
    .kino-btn.primary {
      background: var(--accent);
      color: var(--on-accent);
    }
    .kino-btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
    .kino-btn.secondary {
      background: var(--surface-high);
      color: var(--text);
      border-color: var(--border);
    }
    .kino-btn.secondary:hover:not(:disabled) { border-color: var(--border-strong); }
    .kino-btn.secondary.selected {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, var(--surface-high));
    }
    .kino-btn.text { color: var(--accent); padding: 8px 12px; }
    .kino-btn.text:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
    .kino-btn.icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 999px;
      color: var(--text);
    }
    .kino-btn.icon:hover { background: rgba(255, 255, 255, 0.08); }

    .kino-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin: 10px auto;
      width: calc(100% - 48px);
      max-width: 1272px;
      overflow: hidden;
    }
    .kino-card .kino-text.h3, .kino-card .kino-text.h4 {
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin: 0 !important;
      width: auto !important;
    }
    @media (max-width: 767px) {
      .kino-card { width: calc(100% - 28px); }
    }

    .kino-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1272px;
      width: calc(100% - 48px);
      margin: 20px auto 10px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 6px 8px 6px 16px;
      transition: border-color 0.16s;
    }
    @media (max-width: 767px) {
      .kino-input-wrap { width: calc(100% - 28px); margin: 12px auto 8px; }
    }
    .kino-input-wrap:focus-within { border-color: var(--accent); }
    .kino-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 8px 0;
      min-width: 0;
    }
    .kino-input::placeholder { color: var(--muted); }

    /* Interactive Segmented Filter Bar (replacing generic candy pills) */
    .kino-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 24px !important;
    }
    @media (max-width: 767px) { .kino-chips { padding: 8px 14px !important; } }
    .kino-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.14s var(--ease-out);
    }
    .kino-chip:hover { color: var(--text); border-color: var(--border-strong); }
    .kino-chip.active {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* ================= MUSEUM ACCESSION DETAIL VIEW ================= */
    .detail-shell {
      position: relative;
      width: 100%;
    }
    .detail-ambient-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 440px;
      background-size: cover;
      background-position: center top;
      filter: blur(56px) saturate(1.2);
      opacity: 0.22;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
    }
    .detail-inner {
      position: relative;
      z-index: 2;
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }
    .detail-spread {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 36px;
      align-items: start;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .detail-poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.65);
      background: var(--surface-high);
    }
    .detail-poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-info-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .detail-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.6vw, 3.1rem);
      font-weight: 700;
      line-height: 1.08;
      text-wrap: balance;
      color: var(--text);
    }
    .detail-meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .detail-genres-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .detail-synopsis {
      font-size: 15px;
      line-height: 1.7;
      color: color-mix(in srgb, var(--text) 88%, var(--muted));
      max-width: 72ch;
      margin: 4px 0 0;
    }
    .detail-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .detail-bib-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 0 0;
    }
    .chapters-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 16px;
    }
    .chapters-heading {
      margin: 0;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
    }
    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .chapter-row-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.14s var(--ease-out), background 0.14s var(--ease-out);
    }
    .chapter-row-btn:hover {
      border-color: var(--accent);
      background: var(--surface-high);
    }
    .chapter-row-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }
    .chapter-row-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    @media (max-width: 767px) {
      .detail-inner { padding: 18px 14px 80px; }
      .detail-spread { grid-template-columns: 118px minmax(0, 1fr); gap: 16px; }
      .chapter-grid { grid-template-columns: 1fr; }
    }

    /* ================= STUDIO INTERNAL READERS (NOVEL / MANGA RTL / WEBTOON) ================= */
    .reader-root {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: #07070B;
      color: #F2EFE7;
      overflow: hidden;
      user-select: none;
    }
    .reader-root.mode-novel { user-select: text; }

    /* Surface themes for Novel mode */
    .reader-root[data-novel-theme="obsidian"] { --r-bg: #0A0A0F; --r-ink: #EAE6DC; --r-muted: #9892A6; --r-surface: #14141D; --r-border: rgba(255,255,255,0.09); }
    .reader-root[data-novel-theme="cream"]    { --r-bg: #F7F2E8; --r-ink: #1F1C18; --r-muted: #6C6559; --r-surface: #EDE5D4; --r-border: rgba(31,28,24,0.12); }
    .reader-root[data-novel-theme="sepia"]    { --r-bg: #EDE0C8; --r-ink: #2B2116; --r-muted: #705D47; --r-surface: #E2D1B2; --r-border: rgba(43,33,22,0.14); }
    .reader-root[data-novel-theme="amoled"]   { --r-bg: #000000; --r-ink: #DFDCE2; --r-muted: #827E8C; --r-surface: #0D0D12; --r-border: rgba(255,255,255,0.1); }

    /* Floating Glass HUD */
    .reader-hud-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 58;
      height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(10, 10, 16, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #F4F1EA;
      transition: transform 0.2s var(--ease-out), opacity 0.2s var(--ease-out);
    }
    .reader-hud-bottom {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 58;
      width: min(760px, calc(100vw - 24px));
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(12, 12, 18, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      gap: 12px;
      color: #F4F1EA;
      transition: transform 0.2s var(--ease-out), opacity 0.2s var(--ease-out);
    }
    .reader-root.hud-hidden .reader-hud-top {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }
    .reader-root.hud-hidden .reader-hud-bottom {
      opacity: 0;
      transform: translate(-50%, 24px);
      pointer-events: none;
    }
    .reader-progress-hairline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      z-index: 60;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .reader-progress-hairline-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.14s linear;
    }

    .reader-title-cluster {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .reader-series-name {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-chap-meta {
      font-size: 11.5px;
      color: #A49EB4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reader-hud-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #F4F1EA;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s;
    }
    .reader-hud-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.13);
      border-color: var(--accent);
    }
    .reader-hud-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .reader-hud-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    .reader-scrubber {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      min-width: 80px;
    }

    /* Reader Atelier Settings Drawer */
    .reader-drawer {
      position: fixed;
      top: 66px;
      right: 16px;
      z-index: 62;
      width: 340px;
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 168px);
      overflow-y: auto;
      padding: 18px;
      border-radius: 14px;
      background: rgba(14, 14, 20, 0.94);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      color: #F4F1EA;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: panelDrop 0.16s var(--ease-out);
    }
    @media (max-width: 767px) {
      .reader-drawer {
        top: 60px;
        left: 12px;
        right: 12px;
        width: auto;
        max-width: none;
        max-height: calc(100dvh - 156px);
      }
    }
    .rd-section-lbl {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9E98AE;
      margin-bottom: 6px;
    }
    .rd-seg-row {
      display: grid;
      gap: 6px;
    }
    .rd-seg-btn {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #E7E3D8;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.12s;
    }
    .rd-seg-btn:hover { border-color: rgba(255,255,255,0.28); }
    .rd-seg-btn.active {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
      font-weight: 700;
    }
    .rd-stepper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    /* Novel Monograph Scroll Canvas */
    .novel-canvas {
      flex: 1;
      overflow-y: auto;
      background: var(--r-bg, #0A0A0F);
      color: var(--r-ink, #EAE6DC);
      padding: 92px 24px 120px;
      transition: background 0.2s, color 0.2s;
    }
    .novel-manuscript {
      margin: 0 auto;
      width: 100%;
    }
    .novel-masthead {
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--r-border, rgba(255,255,255,0.1));
    }
    .novel-kicker {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .novel-chapter-title {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 3.2vw, 2.75rem);
      font-weight: 700;
      line-height: 1.12;
      text-wrap: balance;
    }
    .novel-chapter-sub {
      font-size: 13px;
      color: var(--r-muted, #9892A6);
    }
    .novel-paragraph {
      margin: 0 0 1.25em;
    }
    .novel-paragraph strong { font-weight: 700; color: inherit; }
    .novel-paragraph em { font-style: italic; }
    .novel-ornament {
      text-align: center;
      letter-spacing: 0.55em;
      color: var(--accent);
      opacity: 0.78;
      margin: 1.8em 0;
      font-size: 0.95em;
      user-select: none;
    }
    .novel-paragraph.drop-cap::first-letter {
      font-family: var(--font-display);
      font-size: 3.4em;
      font-weight: 700;
      float: left;
      line-height: 0.85;
      margin: 0.06em 0.16em 0 0;
      color: var(--accent);
    }
    .novel-illus {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      margin: 24px auto;
      border-radius: 10px;
      border: 1px solid var(--r-border);
      object-fit: contain;
    }
    .novel-end-card {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--r-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Manga Stage (Single / Spread / Waterfall) */
    .manga-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: #050508;
      padding: 62px 12px 84px;
    }
    .manga-stage.strip-stage {
      display: block;
      padding: 64px 0 110px;
    }
    .manga-spread-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      max-width: 100%;
      max-height: 100%;
    }
    .manga-spread-wrap.rtl { flex-direction: row-reverse; }
    .manga-page-img {
      display: block;
      max-height: calc(100vh - 156px);
      max-width: 100%;
      object-fit: contain;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.75);
      transition: transform 0.18s var(--ease-out);
      cursor: zoom-in;
    }
    .manga-page-img.zoomed {
      max-height: none;
      max-width: none;
      width: 145%;
      cursor: zoom-out;
    }
    .manga-stage.fit-width .manga-page-img {
      max-height: none;
      width: min(920px, 100%);
      height: auto;
    }
    .manga-stage.fit-original .manga-page-img {
      max-height: none;
      max-width: none;
    }
    .manga-spread-wrap .manga-page-img { max-width: 49vw; }

    .manga-tap-zone {
      position: fixed;
      top: 58px;
      bottom: 84px;
      z-index: 54;
      cursor: pointer;
    }
    .manga-tap-left { left: 0; width: 26%; }
    .manga-tap-center { left: 26%; width: 48%; }
    .manga-tap-right { right: 0; width: 26%; }

    /* Webtoon / Cascada Strip */
    .strip-column {
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .strip-panel-img {
      display: block;
      width: 100%;
      height: auto;
      background: #0A0A0E;
    }
    .strip-end-card {
      max-width: 680px;
      margin: 36px auto 0;
      padding: 24px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ================= SKELETON, STATES, TOAST, MODAL ================= */
    .kino-skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-high) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-md);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .kino-state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      padding: 40px 24px;
      margin: 20px auto;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .kino-toast {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%);
      background: color-mix(in srgb, var(--surface-high) 94%, black);
      backdrop-filter: blur(14px);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      z-index: 80;
      max-width: 90vw;
      text-align: center;
    }
    .kino-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 8, 0.72);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 16px;
    }
    .kino-modal {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 22px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
    }
    .loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background: var(--accent);
      z-index: 95;
      animation: pulse 0.9s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const appEl = document.getElementById("app");
      let manifest = null;
      let lang = localStorage.getItem("mv_lang") || "es";
      let activeThemeId = localStorage.getItem("mv_theme") || "atelier-obsidiana";
      let stack = [{ route: { name: "main" }, state: {}, tree: null, scrollTop: 0 }];
      let currentTree = null;
      let busyCount = 0;
      let toastTimer = null;
      let toastMsg = "";
      let modalState = null;
      let themeMenuOpen = false;
      let capsIdleTimer = null;
      let settingsData = { status: {}, values: {} };
      let settingsDraft = {};
      let navEpoch = 0;
      let activeNavAbort = null;
      let activeTabAbort = null;

      // Reader persistent state
      const DEFAULT_READER_PREFS = {
        novelTheme: "obsidian",
        novelFont: "serif",
        novelSize: 18,
        novelLineHeight: 1.8,
        novelMeasure: "medium",
        novelJustify: false,
        novelDropCap: true,
        mangaLayout: "auto",
        mangaDir: "auto",
        mangaFit: "contain",
        stripWidth: 740,
        stripGap: 0,
        brightness: 100,
      };
      let readerPrefs = { ...DEFAULT_READER_PREFS };
      try {
        const savedPrefs = JSON.parse(localStorage.getItem("mv_reader_prefs") || "null");
        if (savedPrefs && typeof savedPrefs === "object") readerPrefs = { ...DEFAULT_READER_PREFS, ...savedPrefs };
      } catch { /* ignore */ }
      let readerHudVisible = true;
      let readerDrawerOpen = false;
      let readerZoomed = false;
      let readerScrollPct = 0;
      let readerPanelIndex = 1;

      function saveReaderPrefs(patch) {
        readerPrefs = { ...readerPrefs, ...patch };
        try { localStorage.setItem("mv_reader_prefs", JSON.stringify(readerPrefs)); } catch { /* ignore */ }
      }

      // Signature Atelier Obsidian theme + manifest themes
      const ATELIER_THEME = {
        id: "atelier-obsidiana",
        name: { es: "Atelier Obsidiana", en: "Obsidian Atelier" },
        colors: {
          accent: "#E2B96F",
          onAccent: "#141008",
          background: "#08080C",
          surface: "#111117",
          surfaceHigh: "#1A1A23",
        },
      };

      // Client-side short TTL caches for instant source switching and detail navigation
      const HOME_CACHE_TTL = 5 * 60 * 1000;
      const DETAIL_CACHE_TTL = 5 * 60 * 1000;
      const homeCache = new Map();
      const detailCache = new Map();

      let SOURCE_LIST = [
        { k: "zt", name: "ZonaTMO", novel: false },
        { k: "ms", name: "ManhwaSS", novel: false },
        { k: "ol", name: "Olympus", novel: false, mixed: true },
        { k: "lc", name: "LeerCapitulo", novel: false },
        { k: "ik", name: "Ikigai", novel: false, mixed: true },
        { k: "lf", name: "LectorFenix", novel: false },
        { k: "mc", name: "MHScans", novel: false, mixed: true },
        { k: "mw", name: "ManhwaWeb", novel: false },
        { k: "sk", name: "Skynovels", novel: true },
        { k: "mk", name: "MatchaNovels", novel: true },
        { k: "as", name: "Astral Novels", novel: true },
        { k: "an", name: "Anslid", novel: true },
        { k: "dv", name: "DevilNovels", novel: true },
        { k: "zo", name: "ZonaTMO.org", novel: false },
        { k: "mh", name: "ManhwaShot", novel: false },
      ];
      const sourceObj = (k) => SOURCE_LIST.find((s) => s.k === k) || SOURCE_LIST[0];
      const sourceName = (k) => sourceObj(k).name;
      const sourceTypeLabel = (s, isLong) => {
        if (s.novel) return isLong ? (lang === "en" ? "Light Novels" : "Novelas Ligeras") : (lang === "en" ? "Novel" : "Novela");
        if (s.mixed) return lang === "en" ? "Comics & Novels" : "Cómics y Novelas";
        return "Manga · Manhwa";
      };

      const ICONS = {
        close: '<path d="M18 6L6 18M6 6l12 12"/>',
        arrow_back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
        arrow_forward: '<path d="M5 12h14M12 5l7 7-7 7"/>',
        arrow_upward: '<path d="M12 19V5M5 12l7-7 7 7"/>',
        arrow_downward: '<path d="M12 5v14M19 12l-7 7-7-7"/>',
        chevron_left: '<path d="m15 18-6-6 6-6"/>',
        chevron_right: '<path d="m9 18 6-6-6-6"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
        home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
        bookmark: '<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>',
        heart: '<path d="M12 21s-7-4.5-9.5-8.5C.7 9.4 2.3 5 6.4 5c2.2 0 4.1 1.2 5.6 3 1.5-1.8 3.4-3 5.6-3 4.1 0 5.7 4.4 3.9 7.5C19 16.5 12 21 12 21z"/>',
        play: '<polygon points="6 4 20 12 6 20 6 4"/>',
        lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        expand_more: '<path d="m6 9 6 6 6-6"/>',
        expand_less: '<path d="m18 15-6-6-6 6"/>',
        delete: '<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/>',
        language: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
        security: '<path d="M12 3 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-3z"/>',
        magic: '<path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/>',
        error: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
        menu_book: '<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',
        fullscreen: '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
        sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
      };

      function svgIcon(name, size = 18) {
        const d = ICONS[name] || ICONS.magic;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", String(size));
        svg.setAttribute("height", String(size));
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "1.9");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.innerHTML = d;
        return svg;
      }

      function allThemes() {
        const list = [ATELIER_THEME];
        if (manifest && Array.isArray(manifest.appThemes)) {
          for (const t of manifest.appThemes) {
            if (t && t.id && !list.some((x) => x.id === t.id)) list.push(t);
          }
        }
        return list;
      }

      function applyTheme(themeId) {
        const themes = allThemes();
        const found = themes.find((t) => t.id === themeId) || ATELIER_THEME;
        if (!found || !found.colors) return;
        activeThemeId = found.id;
        localStorage.setItem("mv_theme", activeThemeId);
        const r = document.documentElement.style;
        r.setProperty("--accent", found.colors.accent);
        r.setProperty("--on-accent", found.colors.onAccent);
        r.setProperty("--bg", found.colors.background);
        r.setProperty("--surface", found.colors.surface);
        r.setProperty("--surface-high", found.colors.surfaceHigh);
      }

      function showToast(msg) {
        if (!msg) return;
        toastMsg = msg;
        if (toastTimer) clearTimeout(toastTimer);
        renderOverlay();
        toastTimer = setTimeout(() => {
          toastMsg = "";
          renderOverlay();
        }, 3200);
      }

      function decodeEntities(s) {
        if (!s || typeof s !== "string" || !s.includes("&")) return s || "";
        const map = { quot: '"', apos: "'", amp: "&", lt: "<", gt: ">", nbsp: " ", "#39": "'", "#039": "'", "#8216": "‘", "#8217": "’", "#8220": "“", "#8221": "”" };
        return s.replace(/&([a-zA-Z0-9#]+);/g, (m, k) => (map[k] !== undefined ? map[k] : m));
      }

      function proxyImageUrl(url, headers) {
        if (!url || typeof url !== "string") return "";
        if (url.startsWith("data:")) return url;
        const params = new URLSearchParams({ url });
        if (headers && headers.Referer) params.set("ref", headers.Referer);
        return "/api/image?" + params.toString();
      }

      function widthClass() {
        const w = window.innerWidth;
        if (w < 600) return "compact";
        if (w < 960) return "medium";
        return "expanded";
      }

      function currentCtx(frame = stack[stack.length - 1]) {
        return {
          route: frame.route,
          state: frame.state,
          lang,
          device: "phone",
          size: { widthClass: widthClass(), widthDp: window.innerWidth, heightDp: window.innerHeight },
        };
      }

      async function apiPost(url, body, { signal = null, silent = false } = {}) {
        if (!silent) {
          busyCount++;
          renderLoadingBar();
        }
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: signal || undefined,
          });
          return await res.json();
        } finally {
          if (!silent) {
            busyCount = Math.max(0, busyCount - 1);
            renderLoadingBar();
          }
        }
      }

      function saveFrameScroll() {
        const top = stack[stack.length - 1];
        if (!top) return;
        const sc = appEl.querySelector(".kino-scroll:not(.horizontal), .kino-list");
        if (sc) top.scrollTop = sc.scrollTop;
      }

      function restoreFrameScroll(scrollTop) {
        if (!scrollTop) return;
        const sc = appEl.querySelector(".kino-scroll:not(.horizontal), .kino-list");
        if (sc) sc.scrollTop = scrollTop;
      }

      function clearCapsIdleTimer() {
        if (capsIdleTimer) {
          clearTimeout(capsIdleTimer);
          capsIdleTimer = null;
        }
      }

      function scheduleCapsIdleClose() {
        clearCapsIdleTimer();
        const top = stack[stack.length - 1];
        if (top?.route?.name === "main" && top?.state?.capsOpen) {
          capsIdleTimer = setTimeout(() => {
            const cur = stack[stack.length - 1];
            if (cur?.route?.name === "main" && cur?.state?.capsOpen) {
              setCapsOpenInstant(false);
            }
          }, 12000);
        }
      }

      function updateCapsuleDom(isOpen, src) {
        const stackBox = appEl.querySelector(".kino-body > .kino-col > .kino-stack");
        const capBtn = appEl.querySelector(".kino-capsule-btn");
        if (!stackBox || !capBtn) return false;

        capBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
        capBtn.classList.toggle("selected", isOpen);
        const sInfo = sourceObj(src);
        capBtn.innerHTML = "";
        const leftGrp = document.createElement("span");
        leftGrp.style.cssText = "display:inline-flex;align-items:center;gap:10px;";
        leftGrp.appendChild(svgIcon("menu_book", 16));
        const nameTxt = document.createElement("span");
        nameTxt.textContent = (lang === "en" ? "Source: " : "Fuente: ") + sInfo.name;
        leftGrp.appendChild(nameTxt);
        capBtn.appendChild(leftGrp);
        const metaTxt = document.createElement("span");
        metaTxt.className = "capsule-meta-hint";
        metaTxt.textContent = sourceTypeLabel(sInfo, true);
        capBtn.appendChild(metaTxt);
        capBtn.appendChild(svgIcon(isOpen ? "expand_less" : "expand_more", 17));

        stackBox.querySelectorAll(".kino-capsule-layer").forEach((n) => n.remove());

        if (isOpen) {
          const scrim = document.createElement("div");
          scrim.className = "kino-col kino-positioned kino-capsule-layer";
          scrim.style.cssText = "inset:0;background:rgba(4,4,8,0.68);backdrop-filter:blur(6px);cursor:pointer;";
          scrim.onclick = () => setCapsOpenInstant(false);

          const panel = document.createElement("div");
          panel.className = "kino-col kino-positioned kino-capsule-layer kino-panel-overlay source-atelier-panel";
          panel.style.top = "6px";
          panel.style.left = "16px";
          panel.style.right = "16px";
          panel.onmouseenter = () => clearCapsIdleTimer();
          panel.onmouseleave = () => scheduleCapsIdleClose();

          const head = document.createElement("div");
          head.className = "source-atelier-head";
          const h3 = document.createElement("h3");
          h3.textContent = (lang === "en" ? "Select Archive Source" : "Elegir fuente") + ` (${SOURCE_LIST.length} ${lang === "en" ? "sources" : "fuentes"})`;
          const hint = document.createElement("span");
          hint.className = "kino-text caption color-muted";
          hint.textContent = lang === "en" ? "Auto-closes after 12s" : "Toca fuera o espera 12 s para cerrar";
          head.appendChild(h3);
          head.appendChild(hint);
          panel.appendChild(head);

          const grid = document.createElement("div");
          grid.className = "source-atelier-grid";
          for (const s of SOURCE_LIST) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "source-tile-btn" + (s.k === src ? " selected" : "");
            const left = document.createElement("div");
            left.style.minWidth = "0";
            const nm = document.createElement("div");
            nm.className = "source-tile-name";
            nm.textContent = s.name;
            const tp = document.createElement("div");
            tp.className = "source-tile-type";
            tp.textContent = sourceTypeLabel(s, false);
            left.appendChild(nm);
            left.appendChild(tp);
            btn.appendChild(left);
            if (s.k === src) btn.appendChild(svgIcon("check", 16));
            btn.onclick = () => selectSourceFast(s.k);
            grid.appendChild(btn);
          }
          panel.appendChild(grid);

          stackBox.appendChild(scrim);
          stackBox.appendChild(panel);
          scheduleCapsIdleClose();
        } else {
          clearCapsIdleTimer();
        }
        return true;
      }

      function setCapsOpenInstant(open) {
        const top = stack[stack.length - 1];
        if (!top || top.route?.name !== "main") return;
        top.state = { ...top.state, capsOpen: open, capsAt: open ? Date.now() : 0 };
        if (!updateCapsuleDom(open, top.state.hsrc || "zt")) {
          refreshScreen({ silent: true });
        }
      }

      function renderSkeletonMain(src) {
        const top = stack[stack.length - 1];
        top.state = { ...top.state, hsrc: src, hrows: null, herr: null, cf: false, cfKind: null, done: false, capsOpen: false };
        clearCapsIdleTimer();
        const skelTree = {
          type: "scaffold",
          appBar: currentTree?.appBar || { type: "appBar", title: lang === "en" ? "Multi-verse Kin" : "Multi-verso Kin", leading: null, actions: [] },
          bottomBar: currentTree?.bottomBar || null,
          fab: currentTree?.fab || null,
          body: {
            type: "col",
            style: { crossAxisAlignment: "stretch" },
            children: [
              {
                type: "row",
                style: { padding: { x: 16, y: 8 } },
                children: [{
                  type: "button",
                  variant: "secondary",
                  icon: "expand_more",
                  label: (lang === "en" ? "Source: " : "Fuente: ") + sourceName(src),
                  selected: false,
                  style: { fill: true },
                  onTap: { event: { name: "capsToggle", arg: null } },
                }],
              },
              { type: "spacer", style: { height: 12 } },
              {
                type: "box",
                children: [{
                  type: "scroll",
                  children: [{
                    type: "col",
                    style: { crossAxisAlignment: "stretch", gap: 16, padding: 24 },
                    children: [
                      { type: "skeleton", shape: "card", style: { height: 280 } },
                      { type: "skeleton", shape: "card", style: { height: 220 } },
                    ],
                  }],
                }],
              },
            ],
          },
        };
        currentTree = skelTree;
        render(0);
      }

      async function selectSourceFast(src) {
        const top = stack[stack.length - 1];
        if (!top || top.route?.name !== "main") return;
        if (activeTabAbort) { activeTabAbort.abort(); activeTabAbort = null; }
        const epoch = ++navEpoch;
        clearCapsIdleTimer();

        const cacheKey = `${lang}:${src}`;
        const cached = homeCache.get(cacheKey);
        if (cached && Date.now() - cached.ts < HOME_CACHE_TTL && cached.tree) {
          top.state = {
            ...top.state,
            hsrc: src,
            hrows: cached.hrows,
            herr: cached.herr,
            cf: cached.cf,
            cfKind: cached.cfKind,
            done: true,
            capsOpen: false,
          };
          top.tree = cached.tree;
          currentTree = cached.tree;
          render(0);
          return;
        }

        renderSkeletonMain(src);
        const ctrl = new AbortController();
        activeTabAbort = ctrl;
        try {
          const data = await apiPost("/api/event", {
            ...currentCtx(top),
            name: "tabSrc",
            arg: src,
            value: null,
            values: {},
            trigger: "tap",
            includeTree: true,
          }, { signal: ctrl.signal, silent: false });
          if (epoch !== navEpoch) return;
          if (data.answer?.state) {
            top.state = { ...top.state, ...data.answer.state, capsOpen: false };
          }
          if (data.tree) {
            top.tree = data.tree;
            currentTree = data.tree;
            if (data.answer?.state?.hrows?.length) {
              homeCache.set(cacheKey, {
                hrows: data.answer.state.hrows,
                herr: data.answer.state.herr || null,
                cf: Boolean(data.answer.state.cf),
                cfKind: data.answer.state.cfKind || null,
                tree: data.tree,
                ts: Date.now(),
              });
            }
            render(0);
          } else {
            await refreshScreen();
          }
        } catch (err) {
          if (err?.name !== "AbortError" && epoch === navEpoch) {
            showToast(lang === "en" ? "Could not load source" : "No se pudo cargar la fuente");
          }
        }
      }

      async function refreshScreen({ silent = false, restoreScroll = true } = {}) {
        const epoch = navEpoch;
        const top = stack[stack.length - 1];
        if (!top) return;
        const savedScroll = restoreScroll ? top.scrollTop : 0;
        const data = await apiPost("/api/screen", currentCtx(top), { silent });
        if (epoch !== navEpoch) return;
        if (data.tree) {
          top.tree = data.tree;
          currentTree = data.tree;
          if (top.route?.name === "ajustes") await loadSettings();
          render(savedScroll);
          scheduleCapsIdleClose();
        }
      }

      async function applyAnswer(ans, serverTree = null, serverRoute = null, serverState = null) {
        if (!ans) return false;
        let needRender = false;
        if (ans.toast) showToast(lang === "en" && ans.toastEn ? ans.toastEn : ans.toast);
        if (ans.close || ans.route?.pop) {
          clearCapsIdleTimer();
          if (activeNavAbort) { activeNavAbort.abort(); activeNavAbort = null; }
          navEpoch++;
          readerDrawerOpen = false;
          readerZoomed = false;
          if (stack.length > 1) {
            stack.pop();
            const prev = stack[stack.length - 1];
            if (prev?.tree) {
              currentTree = prev.tree;
              render(prev.scrollTop || 0);
              if (prev.route?.name === "biblioteca" || prev.route?.name === "ajustes") {
                refreshScreen({ silent: true, restoreScroll: true });
              }
              return true;
            }
            needRender = true;
          }
        } else if (ans.route?.push) {
          saveFrameScroll();
          clearCapsIdleTimer();
          readerHudVisible = true;
          readerDrawerOpen = false;
          readerZoomed = false;
          readerScrollPct = 0;
          readerPanelIndex = 1;
          const nextFrame = {
            route: serverRoute || { name: ans.route.push, params: ans.route.params || {} },
            state: serverState || (ans.state ? { ...ans.state } : {}),
            tree: serverTree || null,
            scrollTop: 0,
          };
          stack.push(nextFrame);
          if (serverTree) {
            currentTree = serverTree;
            if (nextFrame.route.name === "ajustes") await loadSettings();
            render(0);
            return true;
          }
          await refreshScreen({ restoreScroll: false });
          return true;
        }
        if (ans.state && typeof ans.state === "object" && !ans.route?.push) {
          const top = stack[stack.length - 1];
          top.state = { ...top.state, ...ans.state };
          if (ans.state.chapter) {
            readerZoomed = false;
            readerScrollPct = 0;
            readerPanelIndex = 1;
          }
          if (top.route?.name === "main" && ans.state.hrows?.length && top.state.hsrc && serverTree) {
            homeCache.set(`${lang}:${top.state.hsrc}`, {
              hrows: ans.state.hrows,
              herr: ans.state.herr || null,
              cf: Boolean(ans.state.cf),
              cfKind: ans.state.cfKind || null,
              tree: serverTree,
              ts: Date.now(),
            });
          }
          if (top.route?.name === "detalle" && top.state.detailRef && serverTree) {
            detailCache.set(top.state.detailRef, { state: top.state, tree: serverTree, ts: Date.now() });
          }
          needRender = true;
        }
        if (ans.share && stack[stack.length - 1]?.state?.detail) {
          const d = stack[stack.length - 1].state.detail;
          const txt = `${d.title} — Multi-verso Kin`;
          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(txt).then(() => showToast(lang === "en" ? "Copied to clipboard" : "Copiado al portapapeles")).catch(() => showToast(txt));
          } else {
            showToast(txt);
          }
        }
        if (ans.go) {
          await handleGo(ans.go);
          return true;
        }
        if (needRender) {
          const top = stack[stack.length - 1];
          if (serverTree) {
            top.tree = serverTree;
            currentTree = serverTree;
            render(top.scrollTop || 0);
          } else {
            await refreshScreen({ restoreScroll: true });
          }
        }
        return needRender;
      }

      async function handleGo(go) {
        if (!go || typeof go !== "object") return;
        if (go.close) {
          if (stack.length > 1) {
            stack.pop();
            const prev = stack[stack.length - 1];
            if (prev?.tree) {
              currentTree = prev.tree;
              render(prev.scrollTop || 0);
            } else {
              await refreshScreen();
            }
          }
          return;
        }
        if (go.useTheme && go.useTheme.theme) {
          applyTheme(go.useTheme.theme);
          showToast(lang === "en" ? "Theme applied" : "Tema aplicado");
          return;
        }
        if (go.browse && go.browse.ref) {
          const refStr = String(go.browse.ref);
          const srcGuess = refStr.split(":")[0] || "";
          await handleGo({ screen: { route: "fuente", args: { s: srcGuess, ref: refStr, title: go.browse.title || "" } } });
          return;
        }
        if (go.url && go.url.href) {
          modalState = {
            title: go.url.title || (lang === "en" ? "Open external site" : "Abrir sitio externo"),
            body: go.url.href,
            linkHref: go.url.href,
          };
          renderOverlay();
          return;
        }
        if (go.screen) {
          const sc = go.screen;
          saveFrameScroll();
          clearCapsIdleTimer();
          if (activeNavAbort) { activeNavAbort.abort(); activeNavAbort = null; }
          const epoch = ++navEpoch;

          if (!sc.route && sc.args && sc.args.r) {
            const cachedDetail = detailCache.get(sc.args.r);
            if (cachedDetail && Date.now() - cachedDetail.ts < DETAIL_CACHE_TTL) {
              stack.push({
                route: { name: "detalle", params: { r: sc.args.r } },
                state: { ...cachedDetail.state },
                tree: cachedDetail.tree,
                scrollTop: 0,
              });
              currentTree = cachedDetail.tree;
              render(0);
              return;
            }

            const placeholderFrame = {
              route: { name: "detalle", params: { r: sc.args.r } },
              state: { busyDetail: true },
              tree: null,
              scrollTop: 0,
            };
            stack.push(placeholderFrame);
            const ctrl = new AbortController();
            activeNavAbort = ctrl;

            const skelPromise = apiPost("/api/screen", currentCtx(placeholderFrame), { signal: ctrl.signal, silent: true })
              .then((res) => {
                if (epoch === navEpoch && stack[stack.length - 1] === placeholderFrame && placeholderFrame.state.busyDetail && res?.tree) {
                  currentTree = res.tree;
                  render(0);
                }
              }).catch(() => {});

            try {
              const data = await apiPost("/api/event", {
                name: "open",
                arg: null,
                value: null,
                values: {},
                route: { name: "main", args: sc.args, params: sc.params || {} },
                state: {},
                lang,
                device: "phone",
                size: { widthClass: widthClass(), widthDp: window.innerWidth, heightDp: window.innerHeight },
                trigger: "tap",
                includeTree: true,
              }, { signal: ctrl.signal });
              if (epoch !== navEpoch) return;
              if (stack[stack.length - 1] === placeholderFrame) stack.pop();
              await applyAnswer(data.answer, data.tree, data.route, data.state);
              if (data.answer?.state?.detail && data.tree) {
                detailCache.set(sc.args.r, { state: data.answer.state, tree: data.tree, ts: Date.now() });
              }
            } catch (err) {
              if (err?.name !== "AbortError" && epoch === navEpoch) {
                if (stack[stack.length - 1] === placeholderFrame) stack.pop();
                showToast(lang === "en" ? "Could not open title" : "No se pudo abrir el título");
              }
            }
            void skelPromise;
            return;
          }

          const nextRoute = { name: sc.route || "main", args: sc.args || {}, params: sc.params || {} };
          const nextFrame = { route: nextRoute, state: {}, tree: null, scrollTop: 0 };
          stack.push(nextFrame);
          const ctrl = new AbortController();
          activeNavAbort = ctrl;
          await refreshScreen({ restoreScroll: false });
          if (epoch !== navEpoch) return;
          if (nextRoute.name === "fuente" || (nextRoute.args && Object.keys(nextRoute.args).length)) {
            const data = await apiPost("/api/event", {
              ...currentCtx(nextFrame),
              name: "open",
              arg: null,
              value: null,
              values: {},
              trigger: "tap",
              includeTree: true,
            }, { signal: ctrl.signal });
            if (epoch !== navEpoch) return;
            await applyAnswer(data.answer, data.tree, data.route, data.state);
          }
        }
      }

      async function dispatchEvent(name, arg = null, value = null, trigger = "tap") {
        if (name === "capsToggle") {
          setCapsOpenInstant(!stack[stack.length - 1]?.state?.capsOpen);
          return;
        }
        if (name === "capsClose") {
          setCapsOpenInstant(false);
          return;
        }
        if (name === "tabSrc") {
          await selectSourceFast(String(arg || value || "zt"));
          return;
        }

        if (name === "atras" && stack.length > 1) {
          await applyAnswer({ route: { pop: true } });
          return;
        }
        if (name === "navBar") {
          const key = String(value || "");
          const here = stack[stack.length - 1]?.route?.name || "main";
          if (key === "home") {
            if (here === "main") {
              applyHideBar(false);
              return;
            }
            clearCapsIdleTimer();
            if (activeNavAbort) { activeNavAbort.abort(); activeNavAbort = null; }
            navEpoch++;
            stack.splice(1);
            const rootFrame = stack[0];
            if (rootFrame?.tree) {
              currentTree = rootFrame.tree;
              render(rootFrame.scrollTop || 0);
            } else {
              await refreshScreen({ restoreScroll: true });
            }
            return;
          }
          if (key === "buscar") {
            if (here === "buscar") return;
            await handleGo({ screen: { route: "buscar" } });
            return;
          }
          if (key === here) return;
          saveFrameScroll();
          clearCapsIdleTimer();
          navEpoch++;
          stack.push({ route: { name: key, params: {} }, state: {}, tree: null, scrollTop: 0 });
          await refreshScreen({ restoreScroll: false });
          return;
        }

        if (name === "cap") {
          saveFrameScroll();
          if (activeNavAbort) { activeNavAbort.abort(); activeNavAbort = null; }
          const epoch = ++navEpoch;
          const topBefore = stack[stack.length - 1];
          const placeholder = { route: { name: "leer" }, state: { busyChapter: true }, tree: null, scrollTop: 0 };
          stack.push(placeholder);
          const ctrl = new AbortController();
          activeNavAbort = ctrl;
          apiPost("/api/screen", currentCtx(placeholder), { signal: ctrl.signal, silent: true }).then((res) => {
            if (epoch === navEpoch && stack[stack.length - 1] === placeholder && res?.tree) {
              currentTree = res.tree;
              render(0);
            }
          }).catch(() => {});
          try {
            const data = await apiPost("/api/event", {
              ...currentCtx(topBefore),
              name,
              arg,
              value,
              values: {},
              trigger,
              includeTree: true,
            }, { signal: ctrl.signal });
            if (epoch !== navEpoch) return;
            if (stack[stack.length - 1] === placeholder) stack.pop();
            await applyAnswer(data.answer, data.tree, data.route, data.state);
          } catch (err) {
            if (err?.name !== "AbortError" && epoch === navEpoch) {
              if (stack[stack.length - 1] === placeholder) stack.pop();
              await refreshScreen();
              showToast(lang === "en" ? "Could not open chapter" : "No se pudo abrir el capítulo");
            }
          }
          return;
        }

        if (name === "scr" || name === "pag") {
          apiPost("/api/event", {
            ...currentCtx(),
            name,
            arg,
            value,
            values: {},
            trigger,
            includeTree: false,
          }, { silent: true }).then((data) => {
            if (data?.answer?.state) {
              const top = stack[stack.length - 1];
              if (top) top.state = { ...top.state, ...data.answer.state };
            }
          }).catch(() => {});
          return;
        }

        saveFrameScroll();
        const epoch = navEpoch;
        const data = await apiPost("/api/event", {
          ...currentCtx(),
          name,
          arg,
          value,
          values: {},
          trigger,
          includeTree: true,
        });
        if (epoch !== navEpoch) return;
        await applyAnswer(data.answer, data.tree, data.route, data.state);
      }

      async function dispatchAction(action, overrideValue = null, trigger = "tap") {
        if (!action) return;
        if (Array.isArray(action.ui)) {
          for (const op of action.ui) {
            if (op && op.open === "themeSheet") {
              themeMenuOpen = true;
              renderOverlay();
              return;
            }
          }
        }
        if (action.go) {
          await handleGo(action.go);
          return;
        }
        if (action.event) {
          await dispatchEvent(action.event.name, action.event.arg ?? null, overrideValue, trigger);
        }
      }

      async function loadSettings() {
        try {

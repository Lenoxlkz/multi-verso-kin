          const res = await fetch("/api/settings?lang=" + lang);
          settingsData = await res.json();
          settingsDraft = {};
          for (const s of manifest?.settings || []) {
            if (s.type === "text" || s.type === "toggle") settingsDraft[s.key] = settingsData.values[s.key];
            else if (s.type === "password") settingsDraft[s.key] = "";
          }
        } catch { /* ignore */ }
      }

      function applyStyle(el, style) {
        if (!style) return;
        if (style.padding) {
          if (typeof style.padding === "number") el.style.padding = style.padding + "px";
          else {
            const p = style.padding;
            el.style.padding = `${p.y ?? p.top ?? 0}px ${p.x ?? p.end ?? 0}px ${p.y ?? p.bottom ?? 0}px ${p.x ?? p.start ?? 0}px`;
          }
        }
        if (style.gap != null) el.style.gap = style.gap + "px";
        if (style.flex != null) el.style.flex = String(style.flex);
        if (style.width != null || style.w != null) el.style.width = (style.width ?? style.w) + "px";
        if (style.height != null || style.h != null) el.style.height = (style.height ?? style.h) + "px";
        if (style.opacity != null) el.style.opacity = String(style.opacity);
        if (style.background === "surface") el.style.background = "var(--surface)";
        if (style.background === "surfaceVariant") el.style.background = "var(--surface-high)";
        if (style.borderRadius === "large") el.style.borderRadius = "16px";
        if (style.borderRadius === "medium") el.style.borderRadius = "12px";
        if (style.elevation) el.style.boxShadow = "0 20px 56px rgba(0,0,0,0.68)";
        if (style.crossAxisAlignment === "stretch") el.style.alignItems = "stretch";
        if (style.crossAxisAlignment === "start") el.style.alignItems = "flex-start";
        if (style.crossAxisAlignment === "center") el.style.alignItems = "center";
        if (style.mainAxisAlignment === "end") el.style.justifyContent = "flex-end";
        if (style.mainAxisAlignment === "spaceBetween") el.style.justifyContent = "space-between";
        if (style.mainAxisAlignment === "center") el.style.justifyContent = "center";
        if (style.span) el.style.gridColumn = `span ${style.span} / span ${style.span}`;
        if (style.positioned) {
          el.classList.add("kino-positioned");
          for (const side of ["top", "left", "right", "bottom"]) {
            if (style.positioned[side] != null) el.style[side] = style.positioned[side] + "px";
          }
        }
      }

      function applyHideBar(hide) {
        const top = stack[stack.length - 1];
        if (top) top.state = { ...top.state, hideBar: Boolean(hide) };
        const nav = appEl.querySelector(".kino-navbar");
        if (nav) nav.classList.toggle("bar-hidden", Boolean(hide));
      }

      let lastScrollPos = 0;
      let scrollSaveTimer = null;
      function attachScrollHandler(el, onScrollAction) {
        if (!onScrollAction) return;
        const evName = onScrollAction?.event?.name;
        el.addEventListener("scroll", () => {
          const max = el.scrollHeight - el.clientHeight;
          const frac = max > 0 ? Math.max(0, Math.min(1, el.scrollTop / max)) : 0;
          if (evName === "scrMain") {
            const top = stack[stack.length - 1];
            if (top) top.scrollTop = el.scrollTop;
            if (frac > lastScrollPos + 0.02) {
              lastScrollPos = frac;
              applyHideBar(true);
            } else if (frac < lastScrollPos - 0.02 || el.scrollTop < 12) {
              lastScrollPos = frac;
              applyHideBar(false);
            }
            return;
          }
          if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
          scrollSaveTimer = setTimeout(() => {
            dispatchAction(onScrollAction, frac, "change");
          }, 450);
        }, { passive: true });
      }

      function makeFallbackEl(cleanTitle) {
        const fb = document.createElement("div");
        fb.className = "title-poster-fallback";
        fb.appendChild(svgIcon("menu_book", 24));
        const sp = document.createElement("span");
        sp.textContent = cleanTitle;
        fb.appendChild(sp);
        return fb;
      }

      function renderTitleCard(it, headers) {

        const box = document.createElement("div");

        if (it.poster) {
          const img = document.createElement("img");
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = cleanTitle;
          img.src = proxyImageUrl(it.poster, headers);
          img.onerror = () => {
            img.remove();
            box.appendChild(makeFallbackEl(cleanTitle));
          };
          box.appendChild(img);
        } else {
          box.appendChild(makeFallbackEl(cleanTitle));
        }
        if (Array.isArray(it.badges) && it.badges[0]) {
          const b = document.createElement("span");
          b.className = "title-badge";
          b.textContent = it.badges[0];
          box.appendChild(b);
        }
        const t = document.createElement("div");
        t.className = "title-name";
        t.textContent = cleanTitle;
        btn.appendChild(box);
        btn.appendChild(t);
        btn.onclick = () => {
          if (it.open && it.open.screen) handleGo({ screen: it.open.screen });
        };

      }

        inner.className = "detail-inner";

          img.src = posterUrl;

          img.referrerPolicy = "no-referrer";

        info.appendChild(h1);

        const metaParts = [];

        if (metaParts.length) {
          const ml = document.createElement("div");
          ml.className = "detail-meta-line";
          ml.textContent = metaParts.join("  ·  ");
          info.appendChild(ml);
        }

        if (Array.isArray(d.genres) && d.genres.length) {
          const gl = document.createElement("div");
          gl.className = "detail-genres-text";
          gl.textContent = d.genres.slice(0, 6).map((g) => decodeEntities(g)).join("  ·  ");
          info.appendChild(gl);
        }

        if (d.overview) {
          const rawOv = decodeEntities(String(d.overview));
          const descOpen = Boolean(st.descOpen);
          const shortLen = 280;
          const p = document.createElement("p");
          p.className = "detail-synopsis";
          p.textContent = !descOpen && rawOv.length > shortLen
            ? rawOv.slice(0, shortLen).replace(/\s+\S*$/, "") + "…"
            : rawOv.slice(0, 4000);
          info.appendChild(p);
          if (rawOv.length > shortLen) {
            const toggleDesc = document.createElement("button");
            toggleDesc.type = "button";
            toggleDesc.className = "kino-btn text";
            toggleDesc.style.alignSelf = "flex-start";
            toggleDesc.style.paddingLeft = "0";
            toggleDesc.textContent = descOpen ? (en ? "Show less" : "Ver menos") : (en ? "Read full synopsis" : "Leer sinopsis completa");
            toggleDesc.onclick = () => dispatchEvent("descToggle");
            info.appendChild(toggleDesc);
          }
        }

        // Action row
        const actRow = document.createElement("div");
        actRow.className = "detail-actions-row";
        const chaps = d.chapters || [];
        const prog = st.prog;
        if (prog && prog.cr) {
          const contBtn = document.createElement("button");
          contBtn.type = "button";
          contBtn.className = "kino-btn primary";
          contBtn.appendChild(svgIcon("play", 15));
          const sp = document.createElement("span");
          sp.textContent = (en ? "Continue: Ch. " : "Seguir: Cap. ") + prog.n;
          contBtn.appendChild(sp);
          contBtn.onclick = () => dispatchEvent("cap", prog.cr);
          actRow.appendChild(contBtn);
        }
        if (chaps.length) {
          const sortedAsc = [...chaps].map((c, i) => ({ c, i, n: Number(c.n) }))
            .sort((a, b) => (Number.isFinite(a.n) && Number.isFinite(b.n) && a.n !== b.n) ? a.n - b.n : (Number.isFinite(a.n) !== Number.isFinite(b.n) ? (Number.isFinite(a.n) ? -1 : 1) : a.i - b.i))
            .map((x) => x.c);
          const first = sortedAsc[0];
          const last = sortedAsc[sortedAsc.length - 1];
          const firstBtn = document.createElement("button");
          firstBtn.type = "button";
          firstBtn.className = prog?.cr ? "kino-btn secondary" : "kino-btn primary";
          firstBtn.textContent = (en ? "First (" : "Primero (") + first.n + ")";
          firstBtn.onclick = () => dispatchEvent("cap", first.r);
          actRow.appendChild(firstBtn);

          if (last && last.r !== first.r) {
            const lastBtn = document.createElement("button");
            lastBtn.type = "button";
            lastBtn.className = "kino-btn secondary";
            lastBtn.textContent = (en ? "Latest (" : "Último (") + last.n + ")";
            lastBtn.onclick = () => dispatchEvent("cap", last.r);
            actRow.appendChild(lastBtn);
          }
        }

        const favOn = Boolean(st.fav);
        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = "kino-btn secondary" + (favOn ? " selected" : "");
        favBtn.appendChild(svgIcon("heart", 15));
        const fsp = document.createElement("span");
        fsp.textContent = favOn ? (en ? "Liked" : "Te gusta") : (en ? "Like" : "Me Gusta");
        favBtn.appendChild(fsp);
        favBtn.onclick = () => dispatchEvent("fav");
        actRow.appendChild(favBtn);

        const bibBtn = document.createElement("button");
        bibBtn.type = "button";
        bibBtn.className = "kino-btn secondary" + (st.bibTagCur ? " selected" : "");
        bibBtn.appendChild(svgIcon("bookmark", 15));
        const bsp = document.createElement("span");
        bsp.textContent = en ? "Library" : "Biblioteca";
        bibBtn.appendChild(bsp);
        bibBtn.onclick = () => dispatchEvent("bibOpen");
        actRow.appendChild(bibBtn);

        // External link button from normalized tree if present
        const treeJson = currentTree ? findNodeWithUrl(currentTree) : null;
        if (treeJson) {
          const webBtn = document.createElement("button");
          webBtn.type = "button";
          webBtn.className = "kino-btn secondary";
          webBtn.appendChild(svgIcon("language", 15));
          const wsp = document.createElement("span");
          wsp.textContent = en ? "Open site" : "Abrir web";
          webBtn.appendChild(wsp);
          webBtn.onclick = () => handleGo({ url: treeJson });
          actRow.appendChild(webBtn);
        }

        info.appendChild(actRow);

        if (st.bibOpen || st.bibTagCur) {
          const bibBar = document.createElement("div");
          bibBar.className = "detail-bib-bar";
          const tags = [
            { k: "leyendo", t: en ? "Reading" : "Leyendo" },
            { k: "porleer", t: en ? "To read" : "Por leer" },
            { k: "pendiente", t: en ? "On hold" : "Pendiente" },
            { k: "terminado", t: en ? "Finished" : "Terminado" },
          ];
          for (const t of tags) {
            const tb = document.createElement("button");
            tb.type = "button";
            tb.className = "kino-chip" + (st.bibTagCur === t.k ? " active" : "");
            tb.textContent = t.t;
            tb.onclick = () => dispatchEvent("biblio", t.k);
            bibBar.appendChild(tb);
          }
          if (st.bibTagCur) {
            const rm = document.createElement("button");
            rm.type = "button";
            rm.className = "kino-btn text";
            rm.textContent = en ? "Remove tag" : "Quitar";
            rm.onclick = () => dispatchEvent("biblio", "quitar");
            bibBar.appendChild(rm);
          }
          info.appendChild(bibBar);
        }

        spread.appendChild(info);
        inner.appendChild(spread);

        // Chapters section
        const orden = st.capsOrder || "asc";
        const toolbar = document.createElement("div");
        toolbar.className = "chapters-toolbar";
        const chH = document.createElement("h2");
        chH.className = "chapters-heading";
        chH.textContent = (en ? "Chapters" : "Capítulos") + ` (${chaps.length})`;
        toolbar.appendChild(chH);

        if (chaps.length > 1) {
          const sortGrp = document.createElement("div");
          sortGrp.style.cssText = "display:flex;gap:6px;";
          const ascBtn = document.createElement("button");
          ascBtn.type = "button";
          ascBtn.className = "kino-chip" + (orden === "asc" ? " active" : "");
          ascBtn.textContent = en ? "Oldest first" : "Antiguos primero";
          ascBtn.onclick = () => dispatchEvent("capsOrder", "asc");
          const descBtn = document.createElement("button");
          descBtn.type = "button";
          descBtn.className = "kino-chip" + (orden === "desc" ? " active" : "");
          descBtn.textContent = en ? "Newest first" : "Recientes primero";
          descBtn.onclick = () => dispatchEvent("capsOrder", "desc");
          sortGrp.appendChild(ascBtn);
          sortGrp.appendChild(descBtn);
          toolbar.appendChild(sortGrp);
        }
        inner.appendChild(toolbar);

        if (d.src === "dv") {
          const wrapSearch = document.createElement("div");
          wrapSearch.className = "kino-input-wrap";
          wrapSearch.style.width = "100%";
          wrapSearch.style.margin = "0 0 16px";
          const inp = document.createElement("input");
          inp.className = "kino-input";
          inp.type = "search";
          inp.value = d.capsQ || "";
          inp.placeholder = en ? "Search chapter by number or title" : "Buscar capítulo por número o título";
          inp.onkeydown = (e) => {
            if (e.key === "Enter") { e.preventDefault(); dispatchEvent("capq", null, inp.value, "submit"); }
          };
          const sb = document.createElement("button");
          sb.type = "button";
          sb.className = "kino-btn icon";
          sb.appendChild(svgIcon("search", 16));
          sb.onclick = () => dispatchEvent("capq", null, inp.value, "tap");
          wrapSearch.appendChild(inp);
          wrapSearch.appendChild(sb);
          inner.appendChild(wrapSearch);
        }

        const sorted = [...chaps].map((c, i) => ({ c, i, n: Number(c.n) }))
          .sort((a, b) => (Number.isFinite(a.n) && Number.isFinite(b.n) && a.n !== b.n) ? a.n - b.n : (Number.isFinite(a.n) !== Number.isFinite(b.n) ? (Number.isFinite(a.n) ? -1 : 1) : a.i - b.i))
          .map((x) => x.c);
        const ordered = orden === "desc" ? sorted.reverse() : sorted;
        const shown = st.chShow || 60;
        const visibles = ordered.slice(0, shown);

        if (visibles.length) {
          const grid = document.createElement("div");
          grid.className = "chapter-grid";
          for (const c of visibles) {
            const rowBtn = document.createElement("button");
            rowBtn.type = "button";
            rowBtn.className = "chapter-row-btn";
            const num = document.createElement("span");
            num.className = "chapter-row-num";
            num.textContent = (en ? "Ch. " : "Cap. ") + c.n;
            const ttl = document.createElement("span");
            ttl.className = "chapter-row-title";
            ttl.textContent = c.t && c.t !== "Capítulo " + c.n ? decodeEntities(c.t) : "";
            rowBtn.appendChild(num);
            rowBtn.appendChild(ttl);
            if (c.pago) rowBtn.appendChild(svgIcon("lock", 14));
            else rowBtn.appendChild(svgIcon("chevron_right", 15));
            rowBtn.onclick = () => dispatchEvent("cap", c.r);
            grid.appendChild(rowBtn);
          }
          inner.appendChild(grid);
        } else {
          const emp = document.createElement("div");
          emp.className = "kino-state-box";
          emp.textContent = en ? "No chapters listed" : "Sin capítulos listados";
          inner.appendChild(emp);
        }

        const footBtns = document.createElement("div");
        footBtns.style.cssText = "display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;";
        if (chaps.length > shown) {
          const more = document.createElement("button");
          more.type = "button";
          more.className = "kino-btn secondary";
          more.textContent = en ? `Show more (${chaps.length - shown})` : `Ver más capítulos (${chaps.length - shown} más)`;
          more.onclick = () => dispatchEvent("chMas");
          footBtns.appendChild(more);
        }
        if (chaps.length && d.next) {
          const loadMore = document.createElement("button");
          loadMore.type = "button";
          loadMore.className = "kino-btn secondary";
          loadMore.textContent = en ? "Load more from source" : "Cargar más de la fuente";
          loadMore.onclick = () => dispatchEvent("caps");
          footBtns.appendChild(loadMore);
        }
        if (footBtns.children.length) inner.appendChild(footBtns);

        wrap.appendChild(inner);
        shell.appendChild(wrap);
        return shell;
      }

      function findNodeWithUrl(node) {
        if (!node || typeof node !== "object") return null;
        if (node.onTap?.go?.url?.href) return node.onTap.go.url;
        for (const c of node.children || []) {
          const f = findNodeWithUrl(c);
          if (f) return f;
        }
        if (node.body) return findNodeWithUrl(node.body);
        return null;
      }

      /* ================= CUSTOM STUDIO MULTI-MODE READER ================= */
      function preloadPages(pages, currentIdx, headers) {
        for (let offset = 1; offset <= 3; offset++) {
          const u = pages[currentIdx + offset];
          if (u) {
            const img = new Image();
            img.referrerPolicy = "no-referrer";
            img.src = proxyImageUrl(u, headers);
          }
        }
      }

      function renderStudioReader(c, top) {
        const en = lang === "en";
        const isNovel = Boolean(c.text && c.text.length);
        const pages = c.pages || [];
        const headers = c.headers || (c.pages?.[0] ? {} : {});
        const total = isNovel ? c.text.length : pages.length;

        const effectiveLayout = isNovel
          ? "novel"
          : (readerPrefs.mangaLayout === "auto"
              ? (c.direction === "rtl" && pages.length >= 2 ? "single" : "strip")
              : readerPrefs.mangaLayout);
        const effectiveDir = readerPrefs.mangaDir === "auto" ? (c.direction === "rtl" ? "rtl" : "ltr") : readerPrefs.mangaDir;

        const root = document.createElement("div");
        root.className = "reader-root" + (isNovel ? " mode-novel" : "") + (readerHudVisible ? "" : " hud-hidden");
        if (isNovel) root.setAttribute("data-novel-theme", readerPrefs.novelTheme || "obsidian");

        // Top hairline progress bar
        const progLine = document.createElement("div");
        progLine.className = "reader-progress-hairline";
        const progFill = document.createElement("div");
        progFill.className = "reader-progress-hairline-fill";
        const curPagIdx = Math.max(0, Math.min(Math.max(0, pages.length - 1), typeof top.state.pagIdx === "number" ? top.state.pagIdx : ((c.resumePage || 1) - 1)));
        const initPct = isNovel || effectiveLayout === "strip"
          ? Math.round(readerScrollPct * 100)
          : Math.round(((curPagIdx + 1) / Math.max(1, pages.length)) * 100);
        progFill.style.width = Math.max(2, initPct) + "%";
        progLine.appendChild(progFill);
        root.appendChild(progLine);

        // Top floating glass HUD
        const hudTop = document.createElement("header");
        hudTop.className = "reader-hud-top";

        const backBtn = document.createElement("button");
        backBtn.type = "button";
        backBtn.className = "reader-hud-btn";
        backBtn.appendChild(svgIcon("arrow_back", 16));
        const backLbl = document.createElement("span");
        backLbl.textContent = en ? "Back" : "Volver";
        backBtn.appendChild(backLbl);
        backBtn.onclick = () => {
          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
          dispatchEvent("atras");
        };
        hudTop.appendChild(backBtn);

        const titleGrp = document.createElement("div");
        titleGrp.className = "reader-title-cluster";
        const sTitle = document.createElement("div");
        sTitle.className = "reader-series-name";
        sTitle.textContent = decodeEntities(c.mTitle || c.title || (en ? "Reader" : "Lector"));
        const cSub = document.createElement("div");
        cSub.className = "reader-chap-meta tabular-nums";
        const modeTag = isNovel
          ? (en ? "Novel" : "Novela")
          : effectiveLayout === "strip"
            ? "Webtoon"
            : effectiveLayout === "spread"
              ? `Spread (${effectiveDir.toUpperCase()})`
              : `Manga (${effectiveDir.toUpperCase()})`;
        cSub.textContent = `${en ? "Ch." : "Cap."} ${c.number || "?"}  ·  ${modeTag}` + (!isNovel && pages.length ? `  ·  ${effectiveLayout === "strip" ? readerPanelIndex : curPagIdx + 1}/${pages.length}` : "");
        titleGrp.appendChild(sTitle);
        titleGrp.appendChild(cSub);
        hudTop.appendChild(titleGrp);

        const rightHud = document.createElement("div");
        rightHud.style.cssText = "display:flex;align-items:center;gap:8px;flex-shrink:0;";

        const fsBtn = document.createElement("button");
        fsBtn.type = "button";
        fsBtn.className = "reader-hud-btn";
        fsBtn.title = en ? "Fullscreen (F)" : "Pantalla completa (F)";
        fsBtn.appendChild(svgIcon("fullscreen", 16));
        fsBtn.onclick = () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
          else document.exitFullscreen?.().catch(() => {});
        };
        rightHud.appendChild(fsBtn);

        const setBtn = document.createElement("button");
        setBtn.type = "button";
        setBtn.className = "reader-hud-btn" + (readerDrawerOpen ? " active" : "");
        setBtn.appendChild(svgIcon("sliders", 15));
        const setLbl = document.createElement("span");
        setLbl.textContent = isNovel ? "Aa" : (en ? "Reading" : "Lectura");
        setBtn.appendChild(setLbl);
        setBtn.onclick = (e) => {
          e.stopPropagation();
          readerDrawerOpen = !readerDrawerOpen;
          render(0);
        };
        rightHud.appendChild(setBtn);
        hudTop.appendChild(rightHud);
        root.appendChild(hudTop);

        // Brightness container filter
        const brightFilter = readerPrefs.brightness < 100 ? `brightness(${readerPrefs.brightness}%)` : "none";

        // MAIN CONTENT STAGE
        if (isNovel) {
          const canvas = document.createElement("div");
          canvas.className = "novel-canvas";
          canvas.style.filter = brightFilter;

          const measureMap = { narrow: "56ch", medium: "68ch", wide: "82ch" };
          const fontMap = {
            serif: "var(--font-book)",
            editorial: "var(--font-display)",
            sans: "var(--font-sans)",
            mono: "var(--font-mono)",
          };

          const manuscript = document.createElement("article");
          manuscript.className = "novel-manuscript";
          manuscript.style.maxWidth = measureMap[readerPrefs.novelMeasure] || "68ch";
          manuscript.style.fontFamily = fontMap[readerPrefs.novelFont] || "var(--font-book)";
          manuscript.style.fontSize = readerPrefs.novelSize + "px";
          manuscript.style.lineHeight = String(readerPrefs.novelLineHeight);
          manuscript.style.textAlign = readerPrefs.novelJustify ? "justify" : "left";

          const words = c.text.slice(0, 600).join(" ").trim().split(/\s+/).filter(Boolean).length;
          const mins = Math.max(1, Math.round(words / 220));

          const masthead = document.createElement("header");
          masthead.className = "novel-masthead";
          if (c.mTitle) {
            const kick = document.createElement("div");
            kick.className = "novel-kicker";
            kick.textContent = decodeEntities(c.mTitle);
            masthead.appendChild(kick);
          }
          const h1 = document.createElement("h1");
          h1.className = "novel-chapter-title";
          h1.textContent = decodeEntities(c.title || ((en ? "Chapter " : "Capítulo ") + c.number));
          masthead.appendChild(h1);
          const sub = document.createElement("div");
          sub.className = "novel-chapter-sub tabular-nums";
          sub.textContent = `${en ? "Chapter" : "Capítulo"} ${c.number}  ·  ~${mins} min ${en ? "read" : "de lectura"}`;
          masthead.appendChild(sub);
          manuscript.appendChild(masthead);

          if (c.imgs && c.imgs.length) {
            for (const u of c.imgs) {
              const img = document.createElement("img");
              img.className = "novel-illus";
              img.loading = "lazy";
              img.referrerPolicy = "no-referrer";
              img.alt = decodeEntities(c.title || "Illustration");
              img.src = proxyImageUrl(u, {});
              manuscript.appendChild(img);
            }
          }

          function appendFormattedProse(targetEl, txt) {
            const tokenRe = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
            let last = 0;
            let m;
            while ((m = tokenRe.exec(txt)) !== null) {
              if (m.index > last) targetEl.appendChild(document.createTextNode(txt.slice(last, m.index)));
              const tok = m[0];
              if (tok.startsWith("**") && tok.endsWith("**")) {
                const st = document.createElement("strong");
                st.textContent = tok.slice(2, -2);
                targetEl.appendChild(st);
              } else {
                const em = document.createElement("em");
                em.textContent = tok.slice(1, -1);
                targetEl.appendChild(em);
              }
              last = tokenRe.lastIndex;
            }
            if (last < txt.length) targetEl.appendChild(document.createTextNode(txt.slice(last)));
          }

          let firstParaDone = false;
          for (const rawPar of c.text.slice(0, 600)) {
            const par = decodeEntities(rawPar)
              .replace(/\\([*_~`#])/g, "$1")
              .trim();
            if (!par) continue;
            if (/^(?:[*\-_·•~]\s*){3,}$/.test(par) || /^\*{3,}$/.test(par)) {
              const orn = document.createElement("div");
              orn.className = "novel-ornament";
              orn.textContent = "· · ·";
              manuscript.appendChild(orn);
              continue;
            }
            const isHeadingLine = /^\*\*[^*]+\*\*$/.test(par) && par.length < 72;
            const p = document.createElement("p");
            const canDrop = !firstParaDone && !isHeadingLine && readerPrefs.novelDropCap && par.length >= 45 && /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ«"“¡¿]/.test(par);
            p.className = "novel-paragraph" + (canDrop ? " drop-cap" : "");
            if (canDrop) firstParaDone = true;
            appendFormattedProse(p, par);
            manuscript.appendChild(p);
          }

          manuscript.appendChild(buildReaderEndCard(c, en));
          canvas.appendChild(manuscript);

          // Click empty canvas (when not selecting text) toggles HUD
          canvas.onclick = () => {
            if (window.getSelection?.()?.toString()?.length) return;
            if (readerDrawerOpen) { readerDrawerOpen = false; render(0); return; }
            readerHudVisible = !readerHudVisible;
            root.classList.toggle("hud-hidden", !readerHudVisible);
          };

          let scrThrottle = null;
          canvas.addEventListener("scroll", () => {
            const max = canvas.scrollHeight - canvas.clientHeight;
            const frac = max > 0 ? Math.max(0, Math.min(1, canvas.scrollTop / max)) : 0;
            readerScrollPct = frac;
            progFill.style.width = Math.max(2, Math.round(frac * 100)) + "%";
            const pctLbl = root.querySelector(".reader-scrubber-pct");
            if (pctLbl) pctLbl.textContent = `${Math.round(frac * 100)}%`;
            if (scrThrottle) clearTimeout(scrThrottle);
            scrThrottle = setTimeout(() => dispatchEvent("scr", null, frac, "change"), 450);
          }, { passive: true });

          root.appendChild(canvas);
        } else if (effectiveLayout === "strip") {
          const stage = document.createElement("div");
          stage.className = "manga-stage strip-stage";
          stage.style.filter = brightFilter;

          const col = document.createElement("div");
          col.className = "strip-column";
          col.style.width = readerPrefs.stripWidth === 100 ? "100%" : `min(${readerPrefs.stripWidth}px, 100%)`;
          col.style.gap = readerPrefs.stripGap + "px";

          const panelObs = typeof IntersectionObserver !== "undefined"
            ? new IntersectionObserver((entries) => {
                for (const ent of entries) {
                  if (ent.isIntersecting) {
                    const n = Number(ent.target.dataset.idx) + 1;
                    if (n) {
                      readerPanelIndex = n;
                      cSub.textContent = `${en ? "Ch." : "Cap."} ${c.number || "?"}  ·  Webtoon  ·  ${n}/${pages.length}`;
                    }
                  }
                }
              }, { root: stage, threshold: 0.25 })
            : null;

          pages.forEach((u, i) => {
            const img = document.createElement("img");
            img.className = "strip-panel-img";
            img.dataset.idx = String(i);
            img.loading = i < 4 ? "eager" : "lazy";
            img.decoding = "async";
            img.referrerPolicy = "no-referrer";
            img.alt = (en ? "Page " : "Página ") + (i + 1);
            img.src = proxyImageUrl(u, {});
            col.appendChild(img);
            if (panelObs) panelObs.observe(img);
          });

          const endC = buildReaderEndCard(c, en);
          endC.className = "strip-end-card";
          col.appendChild(endC);
          stage.appendChild(col);

          stage.onclick = (e) => {
            if (e.target.closest("button")) return;
            if (readerDrawerOpen) { readerDrawerOpen = false; render(0); return; }
            readerHudVisible = !readerHudVisible;
            root.classList.toggle("hud-hidden", !readerHudVisible);
          };

          let scrThrottle = null;
          stage.addEventListener("scroll", () => {
            const max = stage.scrollHeight - stage.clientHeight;
            const frac = max > 0 ? Math.max(0, Math.min(1, stage.scrollTop / max)) : 0;
            readerScrollPct = frac;
            progFill.style.width = Math.max(2, Math.round(frac * 100)) + "%";
            const pctLbl = root.querySelector(".reader-scrubber-pct");
            if (pctLbl) pctLbl.textContent = `${Math.round(frac * 100)}%`;
            if (scrThrottle) clearTimeout(scrThrottle);
            scrThrottle = setTimeout(() => dispatchEvent("scr", null, frac, "change"), 450);
          }, { passive: true });

          root.appendChild(stage);
        } else {
          // PAGED / SPREAD MANGA VIEWER
          const isSpread = effectiveLayout === "spread" && window.innerWidth >= 820 && pages.length > 1;
          const step = isSpread ? 2 : 1;
          preloadPages(pages, curPagIdx, {});

          const stage = document.createElement("div");
          stage.className = "manga-stage" + (readerPrefs.mangaFit === "width" ? " fit-width" : readerPrefs.mangaFit === "original" ? " fit-original" : "");
          stage.style.filter = brightFilter;

          const wrap = document.createElement("div");
          wrap.className = "manga-spread-wrap" + (effectiveDir === "rtl" ? " rtl" : "");

          const p1 = pages[curPagIdx];
          if (p1) {
            const img1 = document.createElement("img");
            img1.className = "manga-page-img" + (readerZoomed ? " zoomed" : "");
            img1.src = proxyImageUrl(p1, {});
            img1.referrerPolicy = "no-referrer";
            img1.alt = (en ? "Page " : "Página ") + (curPagIdx + 1);
            img1.ondblclick = (e) => {
              e.stopPropagation();
              readerZoomed = !readerZoomed;
              img1.classList.toggle("zoomed", readerZoomed);
            };
            wrap.appendChild(img1);
          }
          if (isSpread && pages[curPagIdx + 1]) {
            const img2 = document.createElement("img");
            img2.className = "manga-page-img";
            img2.src = proxyImageUrl(pages[curPagIdx + 1], {});
            img2.referrerPolicy = "no-referrer";
            img2.alt = (en ? "Page " : "Página ") + (curPagIdx + 2);
            wrap.appendChild(img2);
          }
          stage.appendChild(wrap);
          root.appendChild(stage);

          const goPage = (targetIdx) => {
            const clamped = Math.max(0, Math.min(pages.length - 1, targetIdx));
            if (clamped === curPagIdx) return;
            top.state.pagIdx = clamped;
            readerZoomed = false;
            render(0);
            dispatchEvent("pag", null, clamped, "tap");
          };

          // Interactive click zones respecting RTL / LTR
          if (!readerZoomed) {
            const zLeft = document.createElement("div");
            zLeft.className = "manga-tap-zone manga-tap-left";
            zLeft.onclick = () => {
              if (readerDrawerOpen) { readerDrawerOpen = false; render(0); return; }
              goPage(effectiveDir === "rtl" ? curPagIdx + step : curPagIdx - step);
            };
            const zCenter = document.createElement("div");
            zCenter.className = "manga-tap-zone manga-tap-center";
            zCenter.onclick = () => {
              if (readerDrawerOpen) { readerDrawerOpen = false; render(0); return; }
              readerHudVisible = !readerHudVisible;
              root.classList.toggle("hud-hidden", !readerHudVisible);
            };
            const zRight = document.createElement("div");
            zRight.className = "manga-tap-zone manga-tap-right";
            zRight.onclick = () => {
              if (readerDrawerOpen) { readerDrawerOpen = false; render(0); return; }
              goPage(effectiveDir === "rtl" ? curPagIdx - step : curPagIdx + step);
            };
            root.appendChild(zLeft);
            root.appendChild(zCenter);
            root.appendChild(zRight);
          } else {
            stage.onclick = () => { readerZoomed = false; render(0); };
          }

          root._goPage = goPage;
          root._curPagIdx = curPagIdx;
          root._step = step;
          root._effectiveDir = effectiveDir;
        }

        // Bottom Floating Glass Scrubber / Chapter Bar
        const hudBot = document.createElement("footer");
        hudBot.className = "reader-hud-bottom";

        const prevChBtn = document.createElement("button");
        prevChBtn.type = "button";
        prevChBtn.className = "reader-hud-btn";
        prevChBtn.disabled = !c.prev;
        prevChBtn.appendChild(svgIcon("chevron_left", 15));
        const pSpan = document.createElement("span");
        pSpan.textContent = en ? "Prev" : "Ant.";
        prevChBtn.appendChild(pSpan);
        prevChBtn.onclick = () => c.prev && dispatchEvent("nav", c.prev);
        hudBot.appendChild(prevChBtn);

        if (!isNovel && effectiveLayout !== "strip" && pages.length > 1) {
          const slider = document.createElement("input");
          slider.type = "range";
          slider.className = "reader-scrubber";
          slider.min = "1";
          slider.max = String(pages.length);
          slider.value = String(curPagIdx + 1);
          slider.oninput = (e) => {
            const pIdx = Number(e.target.value) - 1;
            if (root._goPage) root._goPage(pIdx);
          };
          hudBot.appendChild(slider);

          const pInd = document.createElement("span");
          pInd.className = "tabular-nums";
          pInd.style.cssText = "font-size:12px;color:#D2CCE0;min-width:56px;text-align:center;";
          pInd.textContent = `${curPagIdx + 1} / ${pages.length}`;
          hudBot.appendChild(pInd);
        } else {
          const mid = document.createElement("div");
          mid.style.cssText = "flex:1;display:flex;align-items:center;justify-content:center;gap:12px;font-size:12px;color:#CFC9DE;";
          const pctSpan = document.createElement("span");
          pctSpan.className = "reader-scrubber-pct tabular-nums";
          pctSpan.textContent = `${initPct}%`;
          mid.appendChild(pctSpan);
          if (!isNovel && pages.length) {
            const totSpan = document.createElement("span");
            totSpan.className = "tabular-nums";
            totSpan.textContent = `${pages.length} ${en ? "panels" : "viñetas"}`;
            mid.appendChild(totSpan);
          }
          hudBot.appendChild(mid);
        }

        const nextChBtn = document.createElement("button");
        nextChBtn.type = "button";
        nextChBtn.className = "reader-hud-btn" + (c.next ? " active" : "");
        nextChBtn.disabled = !c.next;
        const nSpan = document.createElement("span");
        nSpan.textContent = en ? "Next" : "Sig.";
        nextChBtn.appendChild(nSpan);
        nextChBtn.appendChild(svgIcon("chevron_right", 15));
        nextChBtn.onclick = () => c.next && dispatchEvent("nav", c.next);
        hudBot.appendChild(nextChBtn);

        root.appendChild(hudBot);

        // Settings Drawer
        if (readerDrawerOpen) {
          root.appendChild(buildReaderDrawer(isNovel, effectiveLayout, en));
        }
        return root;
      }

      function buildReaderEndCard(c, en) {
        const box = document.createElement("div");
        box.className = "novel-end-card";
        const left = document.createElement("div");
        left.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;";
        if (c.prev) {
          const b1 = document.createElement("button");
          b1.type = "button";
          b1.className = "kino-btn secondary";
          b1.appendChild(svgIcon("arrow_back", 15));
          const s = document.createElement("span");
          s.textContent = en ? "Previous chapter" : "Capítulo anterior";
          b1.appendChild(s);
          b1.onclick = () => dispatchEvent("nav", c.prev);
          left.appendChild(b1);
        }
        const bBack = document.createElement("button");
        bBack.type = "button";
        bBack.className = "kino-btn secondary";
        bBack.textContent = en ? "Title index" : "Volver a la ficha";
        bBack.onclick = () => dispatchEvent("atras");
        left.appendChild(bBack);
        box.appendChild(left);

        if (c.next) {
          const b2 = document.createElement("button");
          b2.type = "button";
          b2.className = "kino-btn primary";
          const s = document.createElement("span");
          s.textContent = en ? "Next chapter" : "Siguiente capítulo";
          b2.appendChild(s);
          b2.appendChild(svgIcon("arrow_forward", 15));
          b2.onclick = () => dispatchEvent("nav", c.next);
          box.appendChild(b2);
        }
        return box;
      }

      function buildReaderDrawer(isNovel, effectiveLayout, en) {
        const dr = document.createElement("div");
        dr.className = "reader-drawer";
        dr.onclick = (e) => e.stopPropagation();

        const makeGroup = (label, cols, options, currentVal, onSelect) => {
          const sec = document.createElement("div");
          const lbl = document.createElement("div");
          lbl.className = "rd-section-lbl";
          lbl.textContent = label;
          sec.appendChild(lbl);
          const row = document.createElement("div");
          row.className = "rd-seg-row";
          row.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
          for (const opt of options) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "rd-seg-btn" + (currentVal === opt.v ? " active" : "");
            b.textContent = opt.l;
            b.onclick = () => { onSelect(opt.v); render(0); };
            row.appendChild(b);
          }
          sec.appendChild(row);
          return sec;
        };

        if (isNovel) {
          dr.appendChild(makeGroup(en ? "Paper Surface" : "Superficie de lectura", 2, [
            { v: "obsidian", l: "Obsidiana" },
            { v: "cream", l: en ? "Warm Cream" : "Papel Crema" },
            { v: "sepia", l: "Sepia" },
            { v: "amoled", l: "AMOLED" },
          ], readerPrefs.novelTheme, (v) => saveReaderPrefs({ novelTheme: v })));

          dr.appendChild(makeGroup(en ? "Typography" : "Tipografía", 2, [
            { v: "serif", l: "Lora (Libro)" },
            { v: "editorial", l: "Garamond" },
            { v: "sans", l: "Jakarta Sans" },
            { v: "mono", l: "JetBrains Mono" },
          ], readerPrefs.novelFont, (v) => saveReaderPrefs({ novelFont: v })));

          // Font size stepper
          const sizeSec = document.createElement("div");
          const sizeLbl = document.createElement("div");
          sizeLbl.className = "rd-section-lbl";
          sizeLbl.textContent = en ? "Font Size" : "Tamaño de letra";
          sizeSec.appendChild(sizeLbl);
          const stp = document.createElement("div");
          stp.className = "rd-stepper-row";
          const minus = document.createElement("button");
          minus.type = "button"; minus.className = "rd-seg-btn"; minus.textContent = "A-";
          minus.onclick = () => { saveReaderPrefs({ novelSize: Math.max(14, readerPrefs.novelSize - 1) }); render(0); };
          const val = document.createElement("span");
          val.className = "tabular-nums"; val.style.fontSize = "13px";
          val.textContent = readerPrefs.novelSize + "px";
          const plus = document.createElement("button");
          plus.type = "button"; plus.className = "rd-seg-btn"; plus.textContent = "A+";
          plus.onclick = () => { saveReaderPrefs({ novelSize: Math.min(28, readerPrefs.novelSize + 1) }); render(0); };
          stp.append(minus, val, plus);
          sizeSec.appendChild(stp);
          dr.appendChild(sizeSec);

          dr.appendChild(makeGroup(en ? "Column Width" : "Ancho de columna", 3, [
            { v: "narrow", l: en ? "Compact" : "Estrecho" },
            { v: "medium", l: en ? "Optimal" : "Óptimo" },
            { v: "wide", l: en ? "Wide" : "Amplio" },
          ], readerPrefs.novelMeasure, (v) => saveReaderPrefs({ novelMeasure: v })));

          dr.appendChild(makeGroup(en ? "Line Spacing" : "Interlineado", 3, [
            { v: 1.55, l: "1.55" },
            { v: 1.8, l: "1.80" },
            { v: 2.05, l: "2.05" },
          ], readerPrefs.novelLineHeight, (v) => saveReaderPrefs({ novelLineHeight: v })));

          dr.appendChild(makeGroup(en ? "Alignment & Drop Cap" : "Alineación y capitular", 2, [
            { v: false, l: en ? "Left align" : "Izquierda" },
            { v: true, l: en ? "Justify" : "Justificado" },
          ], readerPrefs.novelJustify, (v) => saveReaderPrefs({ novelJustify: v })));

          dr.appendChild(makeGroup(en ? "Editorial Drop Cap" : "Letra capitular inicial", 2, [
            { v: true, l: en ? "Enabled" : "Activada" },
            { v: false, l: en ? "Off" : "Desactivada" },
          ], readerPrefs.novelDropCap, (v) => saveReaderPrefs({ novelDropCap: v })));
        } else {
          dr.appendChild(makeGroup(en ? "Reading Mode" : "Modo de lectura", 3, [
            { v: "single", l: en ? "Single" : "1 Página" },
            { v: "spread", l: en ? "Spread" : "Doble pág." },
            { v: "strip", l: en ? "Cascada" : "Cascada" },
          ], effectiveLayout, (v) => saveReaderPrefs({ mangaLayout: v })));

          if (effectiveLayout !== "strip") {
            dr.appendChild(makeGroup(en ? "Reading Direction" : "Dirección de lectura", 2, [
              { v: "rtl", l: "Manga (Der → Izq)" },
              { v: "ltr", l: "Cómic (Izq → Der)" },
            ], readerPrefs.mangaDir === "auto" ? "rtl" : readerPrefs.mangaDir, (v) => saveReaderPrefs({ mangaDir: v })));

            dr.appendChild(makeGroup(en ? "Page Fit" : "Ajuste de página", 3, [
              { v: "contain", l: en ? "Screen" : "Pantalla" },
              { v: "width", l: en ? "Width" : "Ancho" },
              { v: "original", l: "Original" },
            ], readerPrefs.mangaFit, (v) => saveReaderPrefs({ mangaFit: v })));
          } else {
            dr.appendChild(makeGroup(en ? "Strip Width" : "Ancho de tira", 4, [
              { v: 560, l: "560" },
              { v: 740, l: "740" },
              { v: 960, l: "960" },
              { v: 100, l: "100%" },
            ], readerPrefs.stripWidth, (v) => saveReaderPrefs({ stripWidth: v })));

            dr.appendChild(makeGroup(en ? "Panel Gap" : "Separación", 3, [
              { v: 0, l: en ? "Seamless" : "Continuo" },
              { v: 10, l: "10px" },
              { v: 22, l: "22px" },
            ], readerPrefs.stripGap, (v) => saveReaderPrefs({ stripGap: v })));
          }
        }

        // Brightness control for all modes
        const brSec = document.createElement("div");
        const brLbl = document.createElement("div");
        brLbl.className = "rd-section-lbl";
        brLbl.textContent = (en ? "Brightness" : "Brillo de lectura") + ` (${readerPrefs.brightness}%)`;
        brSec.appendChild(brLbl);
        const brRange = document.createElement("input");
        brRange.type = "range";
        brRange.className = "reader-scrubber";
        brRange.style.width = "100%";
        brRange.min = "65";
        brRange.max = "100";
        brRange.value = String(readerPrefs.brightness);
        brRange.oninput = (e) => {
          saveReaderPrefs({ brightness: Number(e.target.value) });
          brLbl.textContent = (en ? "Brightness" : "Brillo de lectura") + ` (${readerPrefs.brightness}%)`;
          const st = appEl.querySelector(".novel-canvas, .manga-stage");
          if (st) st.style.filter = readerPrefs.brightness < 100 ? `brightness(${readerPrefs.brightness}%)` : "none";
        };
        brSec.appendChild(brRange);
        dr.appendChild(brSec);

        return dr;
      }

      /* ================= STANDARD NODE RENDERER ================= */
      function renderNode(node, ctxMeta = {}) {
        if (!node) return document.createTextNode("");
        switch (node.type) {
          case "col": {
            const el = document.createElement("div");
            el.className = "kino-col";
            if (node.style?.positioned) {
              el.classList.add("kino-capsule-layer");
              if (node.style.background === "surfaceVariant") el.classList.add("kino-panel-overlay");
            }
            applyStyle(el, node.style);
            if (node.onTap) {
              el.style.cursor = "pointer";
              el.onclick = () => dispatchAction(node.onTap);
            }
            for (const c of node.children || []) {
              // If main view has titleRail children inside the inner scroll column, inject spotlight before first shelf
              el.appendChild(renderNode(c, ctxMeta));
            }
            return el;
          }
          case "row": {
            // Wrap capsule button cleanly inside atelier container
            const capsBtnNode = (node.children || []).find((c) => c.onTap?.event?.name === "capsToggle");
            if (capsBtnNode) {
              const shell = document.createElement("div");
              shell.className = "source-bar-shell";
              shell.appendChild(renderNode(capsBtnNode));
              return shell;
            }
            const el = document.createElement("div");
            el.className = node.wrap ? "kino-row wrap-grid" : "kino-row";
            applyStyle(el, node.style);
            for (const c of node.children || []) el.appendChild(renderNode(c));
            return el;
          }
          case "box": {
            const el = document.createElement("div");
            el.className = "kino-stack";
            applyStyle(el, node.style);
            for (const c of node.children || []) el.appendChild(renderNode(c));
            return el;
          }
          case "card": {
            const capsRow = (node.children || []).find((r) => r.type === "row" && (r.children || []).some((c) => c.onTap?.event?.name === "capsToggle"));
            if (capsRow) return renderNode(capsRow, ctxMeta);
            const el = document.createElement("div");
            el.className = "kino-card";
            applyStyle(el, node.style);
            for (const c of node.children || []) el.appendChild(renderNode(c, ctxMeta));
            return el;
          }
          case "popup": {
            return document.createComment("popup:" + (node.key || ""));
          }
          case "avatar": {
            const el = document.createElement("span");
            el.style.cssText = "display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;flex-shrink:0;";
            if (node.icon) el.appendChild(svgIcon(node.icon, 16));
            else el.textContent = decodeEntities(node.text || "");
            return el;
          }
          case "badge": {
            const el = document.createElement("span");
            el.style.cssText = "display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;";
            el.textContent = decodeEntities(node.text || "");
            return el;
          }
          case "icon": {
            return svgIcon(node.name || node.icon || "magic", 18);
          }
          case "pageView": {
            return document.createComment("pageView");
          }
          case "scroll": {
            const el = document.createElement("div");
            el.className = "kino-scroll" + (node.horizontal ? " horizontal" : "");
            applyStyle(el, node.style);
            attachScrollHandler(el, node.onScroll);
            const top = stack[stack.length - 1];
            const isMainScroll = top?.route?.name === "main" && node.onScroll?.event?.name === "scrMain";
            for (const c of node.children || []) {
              if (isMainScroll && c.type === "col") {
                const colEl = document.createElement("div");
                colEl.className = "kino-col";
                applyStyle(colEl, c.style);
                const firstCatalogRail = (c.children || []).find((childNode) =>
                  childNode.type === "titleRail" && !String(childNode.title || "").match(/seguir leyendo|keep reading/i)
                );
                if (firstCatalogRail) {
                  const spotlight = buildHeroSpotlight(top, firstCatalogRail);
                  if (spotlight) colEl.appendChild(spotlight);
                }
                for (const childNode of c.children || []) {
                  if (childNode.type === "pageView") continue;
                  colEl.appendChild(renderNode(childNode));
                }
                el.appendChild(colEl);
              } else {
                el.appendChild(renderNode(c));
              }
            }
            return el;
          }
          case "list": {
            const el = document.createElement("div");
            el.className = "kino-list";
            applyStyle(el, node.style);
            attachScrollHandler(el, { event: { name: "scr", arg: null } });
            for (const it of node.items || []) el.appendChild(renderNode(it));
            return el;
          }
          case "text": {
            const el = document.createElement("p");
            el.className = `kino-text ${node.variant || "p"}` + (node.style?.color ? ` color-${node.style.color}` : "") + (node.onTap ? " tappable" : "");
            el.textContent = decodeEntities(node.text || "");
            if (node.bold) el.style.fontWeight = "700";
            applyStyle(el, node.style);
            if (!node.onTap && (node.variant === "h4" || node.variant === "h3")) {
              el.style.maxWidth = "1320px";
              el.style.width = "100%";
              el.style.margin = "0 auto";
              el.style.paddingLeft = "24px";
              el.style.paddingRight = "24px";
            }
            if (node.onTap) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = el.className;
              btn.style.cssText = "background:none;border:none;text-align:left;color:inherit;font-family:inherit;width:100%;max-width:1320px;margin:0 auto;display:block;";
              btn.textContent = decodeEntities(node.text || "");
              if (node.bold) btn.style.fontWeight = "700";
              applyStyle(btn, node.style);
              if (node.onTap?.event?.name === "histLimpiar") {
                btn.style.padding = "2px 24px 10px";
              }
              btn.onclick = () => dispatchAction(node.onTap);
              return btn;
            }
            return el;
          }
          case "button": {
            const isCapsBtn = node.onTap?.event?.name === "capsToggle";
            const el = document.createElement("button");
            el.type = "button";
            if (isCapsBtn) {
              el.className = "kino-capsule-btn" + (node.selected ? " selected" : "");
              el.setAttribute("aria-expanded", node.selected ? "true" : "false");
              const top = stack[stack.length - 1];
              const sInfo = sourceObj(top?.state?.hsrc || "zt");
              const leftGrp = document.createElement("span");
              leftGrp.style.cssText = "display:inline-flex;align-items:center;gap:10px;";
              leftGrp.appendChild(svgIcon("menu_book", 16));
              const nameTxt = document.createElement("span");
              nameTxt.textContent = decodeEntities(node.label || "");
              leftGrp.appendChild(nameTxt);
              el.appendChild(leftGrp);
              const metaTxt = document.createElement("span");
              metaTxt.className = "capsule-meta-hint";
              metaTxt.textContent = sInfo.novel ? (lang === "en" ? "Light Novels" : "Novelas Ligeras") : "Manga · Manhwa";
              el.appendChild(metaTxt);
              el.appendChild(svgIcon(node.selected ? "expand_less" : "expand_more", 17));
              el.onclick = () => dispatchAction(node.onTap);
              return el;
            }

            el.className = `kino-btn ${node.variant || "primary"}` + (node.selected ? " selected" : "") + (node.style?.fill ? " fill" : "");
            if (node.style?.fill && node.style?.padding) {
              const { padding, ...restStyle } = node.style;
              applyStyle(el, restStyle);
              const px = typeof padding === "number" ? padding : (padding.x ?? padding.start ?? 0);
              const py = typeof padding === "number" ? padding : (padding.y ?? padding.top ?? 0);
              el.style.margin = `${py}px auto`;
              if (px > 0) {
                el.style.maxWidth = "1272px";
                el.style.width = `calc(100% - ${px * 2}px)`;
              }
            } else {
              applyStyle(el, node.style);
            }
            if (node.icon) el.appendChild(svgIcon(node.icon, 16));
            if (node.variant !== "icon" && node.label) {
              const sp = document.createElement("span");
              sp.textContent = decodeEntities(node.label);
              el.appendChild(sp);
            }
            if (node.label) {
              const cleanLbl = decodeEntities(node.label);
              el.title = cleanLbl;
              el.setAttribute("aria-label", cleanLbl);
            }
            el.onclick = () => {
              if (node.confirm) {
                modalState = { title: decodeEntities(node.label || ""), body: node.confirm, onConfirm: () => dispatchAction(node.onTap) };
                renderOverlay();
              } else {
                dispatchAction(node.onTap);
              }
            };
            return el;
          }
          case "textInput": {
            const wrap = document.createElement("div");
            wrap.className = "kino-input-wrap";
            const inp = document.createElement("input");
            inp.className = "kino-input";
            inp.type = "search";
            inp.placeholder = node.label || node.hint || "";
            inp.setAttribute("aria-label", node.label || node.hint || "Buscar");
            inp.value = node.value || "";
            inp.onkeydown = (e) => {
              if (e.key === "Enter" && node.onSubmit) {
                e.preventDefault();
                dispatchAction(node.onSubmit, inp.value, "submit");
              }
            };
            wrap.appendChild(inp);
            if (node.trailing) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "kino-btn icon";
              btn.title = node.trailing.label || "";
              btn.setAttribute("aria-label", node.trailing.label || "Buscar");
              btn.appendChild(svgIcon(node.trailing.icon || "search", 18));
              btn.onclick = () => dispatchAction(node.trailing.onTap, inp.value, "tap");
              wrap.appendChild(btn);
            }
            if (node.autofocus) requestAnimationFrame(() => inp.focus());
            return wrap;
          }
          case "chips": {
            const wrap = document.createElement("div");
            wrap.className = "kino-chips";
            applyStyle(wrap, node.style);
            const selected = Array.isArray(node.value) ? node.value : [node.value];
            for (const opt of node.options || []) {
              const chip = document.createElement("button");
              chip.type = "button";
              chip.className = "kino-chip" + (selected.includes(opt.value) ? " active" : "");
              chip.textContent = opt.label;
              chip.onclick = () => { if (node.onChange) dispatchAction(node.onChange, opt.value, "change"); };
              wrap.appendChild(chip);
            }
            return wrap;
          }
          case "titleRail": {
            const sec = document.createElement("section");
            sec.className = "kino-rail-section";
            const track = document.createElement("div");
            track.className = "kino-rail-track";
            for (const it of node.items || []) track.appendChild(renderTitleCard(it, node.headers));

            const cleanTitle = decodeEntities(node.title || "");
            const moreLabel = (lang === "en" ? "More from " : "Ver más de ") + cleanTitle;
            let moreBtnEl = null;

            if (node.ref) {
              const endCard = document.createElement("button");
              endCard.type = "button";
              endCard.className = "rail-end-card";
              endCard.setAttribute("aria-label", moreLabel);
              const endBox = document.createElement("div");
              endBox.className = "rail-end-box";
              const endIcon = document.createElement("span");
              endIcon.className = "rail-end-icon";
              endIcon.appendChild(svgIcon("chevron_right", 20));
              const endTitle = document.createElement("div");
              endTitle.className = "rail-end-label";
              endTitle.textContent = moreLabel;
              const endSub = document.createElement("div");
              endSub.className = "rail-end-sub";
              endSub.textContent = lang === "en" ? "Browse full category" : "Explorar catálogo completo";
              endBox.append(endIcon, endTitle, endSub);
              endCard.appendChild(endBox);
              endCard.onclick = () => handleGo({ browse: { ref: node.ref, title: cleanTitle } });
              track.appendChild(endCard);
            }

            if (node.title) {
              const hRow = document.createElement("div");
              hRow.className = "kino-rail-header-row";
              const h = document.createElement("h2");
              h.className = "kino-rail-header";
              h.style.margin = "0";
              h.textContent = cleanTitle;
              hRow.appendChild(h);
              const line = document.createElement("div");
              line.className = "rail-hairline";
              hRow.appendChild(line);

              const rightGrp = document.createElement("div");
              rightGrp.className = "rail-header-actions";
              const cnt = document.createElement("span");
              cnt.className = "rail-count tabular-nums";
              const cntNum = (node.items || []).length;
              cnt.textContent = `${cntNum} ${lang === "en" ? (cntNum === 1 ? "title" : "titles") : (cntNum === 1 ? "título" : "títulos")}`;
              rightGrp.appendChild(cnt);

              const arrows = document.createElement("div");
              arrows.className = "rail-arrows";
              const lBtn = document.createElement("button");
              lBtn.type = "button";
              lBtn.className = "rail-arrow-btn";
              lBtn.setAttribute("aria-label", lang === "en" ? "Scroll left" : "Desplazar izquierda");
              lBtn.appendChild(svgIcon("chevron_left", 15));
              lBtn.onclick = () => track.scrollBy({ left: -520, behavior: "smooth" });
              const rBtn = document.createElement("button");
              rBtn.type = "button";
              rBtn.className = "rail-arrow-btn";
              rBtn.setAttribute("aria-label", lang === "en" ? "Scroll right" : "Desplazar derecha");
              rBtn.appendChild(svgIcon("chevron_right", 15));
              rBtn.onclick = () => track.scrollBy({ left: 520, behavior: "smooth" });
              arrows.append(lBtn, rBtn);
              rightGrp.appendChild(arrows);

              if (node.ref) {
                moreBtnEl = document.createElement("button");
                moreBtnEl.type = "button";
                moreBtnEl.className = "rail-more-btn";
                moreBtnEl.title = moreLabel;
                moreBtnEl.setAttribute("aria-label", moreLabel);
                const lblSpan = document.createElement("span");
                lblSpan.textContent = moreLabel;
                moreBtnEl.appendChild(lblSpan);
                moreBtnEl.appendChild(svgIcon("chevron_right", 14));
                moreBtnEl.onclick = () => handleGo({ browse: { ref: node.ref, title: cleanTitle } });
                rightGrp.appendChild(moreBtnEl);
              }

              hRow.appendChild(rightGrp);
              sec.appendChild(hRow);
            }

            if (moreBtnEl) {
              const syncEndState = () => {
                const scrollable = track.scrollWidth > track.clientWidth + 24;
                const atEnd = !scrollable || (track.scrollLeft + track.clientWidth >= track.scrollWidth - 28);
                moreBtnEl.classList.toggle("at-end", atEnd && scrollable);
              };
              track.addEventListener("scroll", syncEndState, { passive: true });
              requestAnimationFrame(syncEndState);
            }

            sec.appendChild(track);
            return sec;
          }
          case "titleGrid": {
            const grid = document.createElement("div");
            grid.className = "kino-grid";
            const cols = Math.max(2, Number(node.columns) || 3);
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            for (const it of node.items || []) grid.appendChild(renderTitleCard(it, node.headers));
            return grid;
          }
          case "errorState":
          case "emptyState": {
            const box = document.createElement("div");
            box.className = "kino-state-box";
            box.appendChild(svgIcon(node.icon || (node.type === "errorState" ? "error" : "magic"), 28));
            if (node.title) {
              const t = document.createElement("div");
              t.style.cssText = "font-family:var(--font-display);font-weight:700;font-size:22px;";
              t.textContent = node.title;
              box.appendChild(t);
            }
            if (node.text) {
              const p = document.createElement("div");
              p.className = "kino-text body color-muted";
              p.textContent = node.text;
              box.appendChild(p);
            }
            return box;
          }
          case "skeleton": {
            const el = document.createElement("div");
            el.className = "kino-skeleton";
            el.style.height = (node.style?.height || (node.shape === "line" ? 18 : 180)) + "px";
            if (node.style?.width) el.style.width = node.style.width + "px";
            if (node.style?.flex) el.style.flex = String(node.style.flex);
            return el;
          }
          case "spacer": {
            const el = document.createElement("div");
            if (node.style?.height) el.style.height = node.style.height + "px";
            if (node.style?.width) el.style.width = node.style.width + "px";
            el.style.flexShrink = "0";
            return el;
          }
          default: {
            const el = document.createElement("div");
            for (const c of node.children || []) el.appendChild(renderNode(c));
            return el;
          }
        }
      }

      /* ================= MASTER RENDER ================= */
      function render(restoreScrollTop = null) {
        appEl.innerHTML = "";
        const top = stack[stack.length - 1];
        const routeName = top?.route?.name || "main";
        const isReaderActive = routeName === "leer" && Boolean(top?.state?.chapter);
        document.body.classList.toggle("reader-active", isReaderActive);

        if (isReaderActive) {
          appEl.appendChild(renderStudioReader(top.state.chapter, top));
          renderOverlay();
          renderLoadingBar();
          return;
        }

        if (!currentTree) return;
        const root = currentTree;

        if (root.type === "scaffold") {
          // 3-Zone Top Bar Contract
          const bar = document.createElement("header");
          bar.className = "kino-appbar";
          const barInner = document.createElement("div");
          barInner.className = "kino-appbar-inner";

          // Zone 1: Brand / Back
          const brandZone = document.createElement("div");
          brandZone.className = "topbar-brand-zone";
          if (stack.length > 1) {
            const backBtn = document.createElement("button");
            backBtn.type = "button";
            backBtn.className = "kino-btn icon";
            backBtn.setAttribute("aria-label", lang === "en" ? "Back" : "Atrás");
            backBtn.appendChild(svgIcon("arrow_back", 18));
            backBtn.onclick = () => dispatchEvent("atras");
            brandZone.appendChild(backBtn);
          }
          const wm = document.createElement("button");
          wm.type = "button";
          wm.className = "wordmark-btn";
          wm.textContent = "Multi-verso Kin";
          wm.onclick = () => dispatchEvent("navBar", null, "home", "tap");
          brandZone.appendChild(wm);
          barInner.appendChild(brandZone);

          // Zone 2: Clean typographic navigation links (inline on desktop, docked bottom on mobile)
          const nav = document.createElement("nav");
          nav.className = "kino-navbar";
          const navItems = [
            { key: "home", icon: "home", label: lang === "en" ? "Home" : "Inicio" },
            { key: "biblioteca", icon: "bookmark", label: lang === "en" ? "Library" : "Biblioteca" },
            { key: "buscar", icon: "search", label: lang === "en" ? "Search" : "Buscar" },
          ];
          const activeNavKey = routeName === "biblioteca" ? "biblioteca" : routeName === "buscar" ? "buscar" : "home";
          for (const it of navItems) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "kino-nav-item" + (activeNavKey === it.key ? " active" : "");
            btn.appendChild(svgIcon(it.icon, 16));
            const sp = document.createElement("span");
            sp.textContent = it.label;
            btn.appendChild(sp);
            btn.onclick = () => dispatchEvent("navBar", null, it.key, "tap");
            nav.appendChild(btn);
          }
          barInner.appendChild(nav);

          // Zone 3: Theme Atelier & Language Switch
          const actions = document.createElement("div");
          actions.className = "kino-appbar-actions";

          const themeBtn = document.createElement("button");
          themeBtn.type = "button";
          themeBtn.className = "utility-btn";
          themeBtn.setAttribute("aria-label", lang === "en" ? "Change theme" : "Cambiar tema");
          const swatch = document.createElement("span");
          swatch.className = "theme-swatch-dot";
          themeBtn.appendChild(swatch);
          const tLbl = document.createElement("span");
          tLbl.textContent = lang === "en" ? "Theme" : "Tema";
          themeBtn.appendChild(tLbl);
          themeBtn.onclick = (e) => {
            e.stopPropagation();
            themeMenuOpen = !themeMenuOpen;
            renderOverlay();
          };
          actions.appendChild(themeBtn);

          const langBtn = document.createElement("button");
          langBtn.type = "button";
          langBtn.className = "utility-btn";
          langBtn.textContent = lang.toUpperCase();
          langBtn.title = lang === "en" ? "Switch language" : "Cambiar idioma";
          langBtn.onclick = () => {
            lang = lang === "es" ? "en" : "es";
            localStorage.setItem("mv_lang", lang);
            refreshScreen({ restoreScroll: true });
          };
          actions.appendChild(langBtn);
          barInner.appendChild(actions);
          bar.appendChild(barInner);
          appEl.appendChild(bar);

          // Body
          const bodyWrap = document.createElement("main");
          bodyWrap.className = "kino-body";
          if (routeName === "detalle" && top?.state?.detail) {
            bodyWrap.appendChild(renderDetailView(top));
          } else if (root.body) {
            const renderedBody = renderNode(root.body);
            if (routeName === "fuente" && !renderedBody.classList?.contains("kino-scroll")) {
              const scWrap = document.createElement("div");
              scWrap.className = "kino-scroll";
              if (renderedBody.style) renderedBody.style.flex = "none";
              const gridInside = renderedBody.querySelector?.(".kino-grid");
              if (gridInside) gridInside.style.flex = "none";
              scWrap.appendChild(renderedBody);
              bodyWrap.appendChild(scWrap);
            } else {
              bodyWrap.appendChild(renderedBody);
            }
          }
          appEl.appendChild(bodyWrap);
        } else {
          appEl.appendChild(renderNode(root));
        }

        if (typeof restoreScrollTop === "number" && restoreScrollTop > 0) {
          restoreFrameScroll(restoreScrollTop);
        }
        renderOverlay();
        renderLoadingBar();
      }

      function renderLoadingBar() {
        let bar = document.getElementById("loading-bar");
        if (busyCount > 0) {
          if (!bar) {
            bar = document.createElement("div");
            bar.id = "loading-bar";
            bar.className = "loading-bar";
            document.body.appendChild(bar);
          }
        } else if (bar) {
          bar.remove();
        }
      }

      function renderOverlay() {
        document.querySelectorAll(".kino-toast, .kino-modal-backdrop, .theme-popover-backdrop, .theme-popover").forEach((x) => x.remove());
        if (themeMenuOpen) {
          const bd = document.createElement("div");
          bd.className = "theme-popover-backdrop";
          bd.onclick = () => { themeMenuOpen = false; renderOverlay(); };
          const pop = document.createElement("div");
          pop.className = "theme-popover";
          const ttl = document.createElement("h4");
          ttl.className = "theme-popover-title";
          ttl.textContent = lang === "en" ? "Editorial Palettes" : "Paletas de Estilo";
          pop.appendChild(ttl);
          const grid = document.createElement("div");
          grid.className = "theme-grid";
          for (const th of allThemes()) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "theme-opt-btn" + (th.id === activeThemeId ? " active" : "");
            const sw = document.createElement("span");
            sw.className = "theme-opt-swatch";
            sw.style.background = th.colors?.accent || "#E2B96F";
            const nm = document.createElement("span");
            nm.className = "theme-opt-name";
            nm.textContent = (lang === "en" ? th.name?.en : th.name?.es) || th.id;
            b.append(sw, nm);
            b.onclick = () => {
              applyTheme(th.id);
              themeMenuOpen = false;
              renderOverlay();
              showToast((lang === "en" ? "Theme: " : "Tema: ") + nm.textContent);
            };
            grid.appendChild(b);
          }
          pop.appendChild(grid);
          document.body.append(bd, pop);
        }

        if (toastMsg) {
          const t = document.createElement("div");
          t.className = "kino-toast";
          t.textContent = toastMsg;
          document.body.appendChild(t);
        }
        if (modalState) {
          const bd = document.createElement("div");
          bd.className = "kino-modal-backdrop";
          const m = document.createElement("div");
          m.className = "kino-modal";
          const h = document.createElement("div");
          h.className = "kino-text h4";
          h.textContent = modalState.title || "";
          const p = document.createElement("div");
          p.className = "kino-text body color-muted";
          p.textContent = modalState.body || "";
          const row = document.createElement("div");
          row.className = "kino-row";
          row.style.cssText = "gap:8px;justify-content:flex-end;";

          const cancel = document.createElement("button");
          cancel.type = "button";
          cancel.className = "kino-btn secondary";
          cancel.textContent = lang === "en" ? "Cancel" : "Cancelar";
          cancel.onclick = () => { modalState = null; renderOverlay(); };
          row.appendChild(cancel);

          if (modalState.linkHref) {
            const a = document.createElement("a");
            a.className = "kino-btn primary";
            a.style.textDecoration = "none";
            a.href = modalState.linkHref;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = lang === "en" ? "Open link" : "Abrir enlace";
            a.onclick = () => { modalState = null; renderOverlay(); };
            row.appendChild(a);
          } else if (modalState.onConfirm) {
            const ok = document.createElement("button");
            ok.type = "button";
            ok.className = "kino-btn primary";
            ok.textContent = lang === "en" ? "Confirm" : "Confirmar";
            ok.onclick = () => {
              const fn = modalState.onConfirm;
              modalState = null;
              renderOverlay();
              fn();
            };
            row.appendChild(ok);
          }

          m.append(h, p, row);
          bd.appendChild(m);
          document.body.appendChild(bd);
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (themeMenuOpen) { themeMenuOpen = false; renderOverlay(); return; }
          if (readerDrawerOpen) { readerDrawerOpen = false; render(0); return; }
          if (stack[stack.length - 1]?.state?.capsOpen) { setCapsOpenInstant(false); return; }
        }
        const readerRoot = appEl.querySelector(".reader-root");
        if (!readerRoot) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA") return;

        if (e.key === "h" || e.key === "H") {
          readerHudVisible = !readerHudVisible;
          readerRoot.classList.toggle("hud-hidden", !readerHudVisible);
        } else if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
          else document.exitFullscreen?.().catch(() => {});
        } else if (readerRoot._goPage) {
          const step = readerRoot._step || 1;
          const cur = readerRoot._curPagIdx || 0;
          const rtl = readerRoot._effectiveDir === "rtl";
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            readerRoot._goPage(rtl ? cur + step : cur - step);
          } else if (e.key === "ArrowRight" || e.key === " ") {
            e.preventDefault();
            readerRoot._goPage(rtl ? cur - step : cur + step);
          }
        }
      });

      async function boot() {
        try {
          const res = await fetch("/api/manifest");
          manifest = await res.json();
          if (Array.isArray(manifest?.sources) && manifest.sources.length) {
            SOURCE_LIST = manifest.sources;
          }
          applyTheme(activeThemeId);
        } catch {
          applyTheme(activeThemeId);
        }
        await refreshScreen();
        const data = await apiPost("/api/event", {
          ...currentCtx(),
          name: "open",
          arg: null,
          value: null,
          values: {},
          trigger: "tap",
          includeTree: true,
        });
        await applyAnswer(data.answer, data.tree, data.route, data.state);
      }

      boot();
    })();
  </script>
</body>
</html>
